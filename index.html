","r":"hi","em":"lửa","x":""},{"t":"k","l":43,"k":"今","h":"kim","m":"bây giờ, hiện tại","n":"亼 (tập: họp) + 乛 (đầu) → thời điểm đang họp → hiện tại. Mẹo: \"Thời điểm họp là kim\"","ex":"今にも","r":"ima ni mo","em":"bất cứ lúc nào, sắp sửa","x":""},{"t":"k","l":44,"k":"泣","h":"khấp","m":"khóc","n":"氵 (thủy: nước) + 立 (lập: đứng) → nước mắt đứng (chảy) → khóc. Mẹo: \"Nước mắt đứng là khóc\"","ex":"泣きます","r":"nakimasu","em":"khóc","x":""},{"t":"k","l":44,"k":"笑","h":"tiếu","m":"cười","n":"竹 (trúc: tre) + 夭 (yêu: yểu) → cây tre cong như đang cười → cười. Mẹo: \"Tre cong là cười\"","ex":"笑います","r":"waraimasu","em":"cười","x":""},{"t":"k","l":44,"k":"眠","h":"miên","m":"ngủ","n":"目 (mục: mắt) + 民 (dân: dân) → mắt của dân đang ngủ → ngủ. Mẹo: \"Mắt dân ngủ là miên\"","ex":"眠ります","r":"nemurimasu","em":"ngủ","x":""},{"t":"k","l":44,"k":"乾","h":"can","m":"khô","n":"十 (thập: mười) + 日 (nhật: mặt trời) + 乞 (khất: xin) → mặt trời xin cho khô → khô. Mẹo: \"Mặt trời xin khô\"","ex":"乾きます","r":"kawakimasu","em":"khô (quần áo)","x":""},{"t":"k","l":44,"k":"滑","h":"hoạt","m":"trơn, trượt","n":"氵 (thủy: nước) + 骨 (cốt: xương) → nước trên xương trơn → trơn. Mẹo: \"Nước xương trơn là hoạt\"","ex":"滑ります","r":"suberimasu","em":"trượt, trơn","x":""},{"t":"k","l":44,"k":"起","h":"khởi","m":"thức dậy, xảy ra","n":"走 (tẩu: chạy) + 己 (kỷ: mình) → mình chạy dậy → khởi. Mẹo: \"Mình chạy dậy là khởi\"","ex":"起きます","r":"okimasu","em":"thức dậy, xảy ra","x":""},{"t":"k","l":44,"k":"調","h":"điều","m":"điều chỉnh, điều tra","n":"言 (ngôn: lời) + 周 (chu: vòng) → nói vòng để điều chỉnh. Mẹo: \"Nói vòng là điều\"","ex":"調節します","r":"chōsetsu shimasu","em":"điều chỉnh, điều tiết","x":""},{"t":"k","l":44,"k":"節","h":"tiết","m":"tiết chế, khớp","n":"竹 (trúc: tre) + 即 (tức: liền) → tre liền khớp → tiết. Mẹo: \"Tre liền là tiết\"","ex":"調節します","r":"chōsetsu shimasu","em":"điều tiết","x":""},{"t":"k","l":44,"k":"安","h":"an","m":"an toàn, yên ổn","n":"宀 (miên: nhà) + 女 (nữ: đàn bà) → đàn bà trong nhà → an toàn. Mẹo: \"Đàn bà trong nhà là an\"","ex":"安全[な]","r":"anzen [na]","em":"an toàn","x":""},{"t":"k","l":44,"k":"全","h":"toàn","m":"toàn bộ, hoàn toàn","n":"入 (nhập: vào) + 王 (vương: vua) → vua vào giữ → toàn bộ. Mẹo: \"Vua vào giữ là toàn\"","ex":"安全[な]","r":"anzen [na]","em":"an toàn","x":""},{"t":"k","l":44,"k":"危","h":"nguy","m":"nguy hiểm","n":"⺈ + 厂 + 巳 → người đứng trên vách đá sắp ngã → nguy. Mẹo: \"Trên vách đá là nguy\"","ex":"危険[な]","r":"kiken [na]","em":"nguy hiểm","x":""},{"t":"k","l":44,"k":"険","h":"hiểm","m":"hiểm trở, nguy hiểm","n":"阝 (phụ: núi) + 僉 (thiêm: cùng) → núi chồng chất hiểm trở. Mẹo: \"Núi chồng là hiểm\"","ex":"危険[な]","r":"kiken [na]","em":"nguy hiểm","x":""},{"t":"k","l":44,"k":"濃","h":"nồng","m":"đậm, nồng","n":"氵 (thủy: nước) + 農 (nông: nông) → nước nông nhưng đậm → nồng. Mẹo: \"Nước nông nhưng đậm\"","ex":"濃い","r":"koi","em":"đậm (màu, vị)","x":""},{"t":"k","l":44,"k":"薄","h":"bạc","m":"mỏng, nhạt","n":"艸 (thảo: cỏ) + 溥 (bạc: rộng) → cỏ mỏng rải rộng → mỏng. Mẹo: \"Cỏ mỏng rải là bạc\"","ex":"薄い","r":"usui","em":"mỏng, nhạt","x":""},{"t":"k","l":44,"k":"厚","h":"hậu","m":"dày","n":"厂 (hán: vách đá) + 日 (nhật: mặt trời) + 子 (tử: con) → con ở vách đá dày → dày. Mẹo: \"Vách đá dày là hậu\"","ex":"厚い","r":"atsui","em":"dày","x":""},{"t":"k","l":44,"k":"太","h":"thái","m":"to, béo","n":"大 (đại: lớn) + 丶 (chấm: nhấn) → lớn hơn thường → to. Mẹo: \"Lớn thêm là thái\"","ex":"太い","r":"futoi","em":"to, béo","x":""},{"t":"k","l":44,"k":"細","h":"tế","m":"nhỏ, mảnh","n":"糸 (mịch: tơ) + 田 (điền: ruộng) → sợi tơ mảnh như ruộng. Mẹo: \"Tơ mảnh là tế\"","ex":"細い","r":"hosoi","em":"nhỏ, mảnh","x":""},{"t":"k","l":44,"k":"空","h":"không","m":"không khí, bầu trời","n":"穴 (huyệt: hang) + 工 (công: làm) → làm hang rỗng → không. Mẹo: \"Làm hang rỗng là không\"","ex":"空気","r":"kūki","em":"không khí","x":""},{"t":"k","l":44,"k":"気","h":"khí","m":"khí, hơi, tinh thần","n":"气 (khí: hơi) + 米 (mễ: gạo) → hơi gạo → khí. Mẹo: \"Hơi gạo là khí\"","ex":"空気","r":"kūki","em":"không khí","x":""},{"t":"k","l":44,"k":"涙","h":"lệ","m":"nước mắt","n":"氵 (thủy: nước) + 戾 (lệ: trở lại) → nước mắt trở lại → lệ. Mẹo: \"Nước mắt chảy là lệ\"","ex":"涙","r":"namida","em":"nước mắt","x":""},{"t":"k","l":44,"k":"和","h":"hòa","m":"hòa hợp, Nhật Bản","n":"禾 (hòa: lúa) + 口 (khẩu: miệng) → miệng ăn lúa hòa hợp. Mẹo: \"Lúa miệng là hòa\"","ex":"和食","r":"washoku","em":"đồ ăn Nhật (hòa thực)","x":""},{"t":"k","l":44,"k":"食","h":"thực","m":"ăn, thức ăn","n":"Hình cái miệng đang ăn → thức ăn. Mẹo: \"Miệng ăn là thực\"","ex":"和食","r":"washoku","em":"đồ ăn Nhật","x":""},{"t":"k","l":44,"k":"洋","h":"dương","m":"phương Tây, đại dương","n":"氵 (thủy: nước) + 羊 (dương: dê) → nước ngoài (phương Tây). Mẹo: \"Nước dê là dương\"","ex":"洋食","r":"yōshoku","em":"đồ ăn phương Tây","x":""},{"t":"k","l":44,"k":"量","h":"lượng","m":"số lượng, khối lượng","n":"日 (nhật: mặt trời) + 里 (lý: dặm) → dặm dưới mặt trời → đo đạc. Mẹo: \"Dặm dưới trời là lượng\"","ex":"量","r":"ryō","em":"số lượng","x":""},{"t":"k","l":44,"k":"倍","h":"bội","m":"gấp bội, gấp nhiều lần","n":"亻 (nhân: người) + 咅 (phủ: mở) → người mở ra gấp bội. Mẹo: \"Người mở gấp bội\"","ex":"～倍","r":"～bai","em":"gấp... lần","x":""},{"t":"k","l":44,"k":"洗","h":"tẩy","m":"giặt, rửa","n":"氵 (thủy: nước) + 先 (tiên: trước) → nước trước để giặt → tẩy. Mẹo: \"Nước trước giặt là tẩy\"","ex":"洗濯物","r":"sentakumono","em":"quần áo giặt","x":""},{"t":"k","l":44,"k":"濯","h":"trạc","m":"giặt giũ","n":"氵 (thủy: nước) + 翟 (trạc: chim trạc) → nước chim giặt → trạc. Mẹo: \"Nước chim giặt là trạc\"","ex":"洗濯物","r":"sentakumono","em":"quần áo giặt","x":""},{"t":"k","l":44,"k":"物","h":"vật","m":"đồ vật","n":"牛 (ngưu: trâu) + 勿 (vật: đừng) → thịt trâu là vật. Mẹo: \"Thịt trâu là vật\"","ex":"洗濯物","r":"sentakumono","em":"quần áo giặt (vật)","x":""},{"t":"k","l":45,"k":"信","h":"tín","m":"tin tưởng, tín nhiệm","n":"亻 (nhân: người) + 言 (ngôn: lời) → lời nói của người đáng tin → tin tưởng. Mẹo: \"Lời người là tín\"","ex":"信じます","r":"shinjimasu","em":"tin tưởng","x":""},{"t":"k","l":45,"k":"知","h":"tri","m":"biết","n":"矢 (thỉ: tên) + 口 (khẩu: miệng) → miệng bắn tên biết (kiến thức) → biết. Mẹo: \"Miệng tên là biết\"","ex":"知らせます","r":"shirasemasu","em":"báo tin, cho biết","x":""},{"t":"k","l":45,"k":"保","h":"bảo","m":"bảo đảm, giữ gìn","n":"亻 (nhân: người) + 呆 (ngai: ngốc) → người giữ bảo bọc → bảo. Mẹo: \"Người giữ bảo\"","ex":"保証書","r":"hoshōsho","em":"giấy bảo đảm, bảo chứng","x":""},{"t":"k","l":45,"k":"証","h":"chứng","m":"chứng minh, chứng chỉ","n":"言 (ngôn: lời) + 正 (chính: đúng) → lời đúng để chứng minh. Mẹo: \"Lời đúng là chứng\"","ex":"保証書","r":"hoshōsho","em":"giấy chứng nhận","x":""},{"t":"k","l":45,"k":"書","h":"thư","m":"sách, giấy viết","n":"聿 (duật: bút) + 日 (nhật: mặt trời) → viết dưới mặt trời → sách vở. Mẹo: \"Bút viết là thư\"","ex":"保証書","r":"hoshōsho","em":"sách chứng nhận","x":""},{"t":"k","l":45,"k":"領","h":"lãnh","m":"nhận, lãnh thổ","n":"令 (lệnh: ra lệnh) + 頁 (hiệt: đầu) → đầu ra lệnh nhận lãnh. Mẹo: \"Đầu ra lệnh là lãnh\"","ex":"領収書","r":"ryōshūsho","em":"biên lai (lãnh thâu thư)","x":""},{"t":"k","l":45,"k":"収","h":"thâu","m":"thu thập, nhận","n":"又 (hựu: tay) + 丿 (phiệt: nét xéo) → tay thu gom lại → thu. Mẹo: \"Tay thu là thâu\"","ex":"領収書","r":"ryōshūsho","em":"biên lai","x":""},{"t":"k","l":45,"k":"中","h":"trung","m":"giữa, dừng","n":"Cây gậy cắm xuyên qua tâm vòng tròn → ở giữa. Mẹo: \"Cắm xuyên tâm là trung\"","ex":"中止","r":"chūshi","em":"dừng lại, hủy bỏ (trung chỉ)","x":""},{"t":"k","l":45,"k":"止","h":"chỉ","m":"dừng lại","n":"Hình bàn chân đứng yên → dừng. Mẹo: \"Chân dừng là chỉ\"","ex":"中止","r":"chūshi","em":"dừng lại, hủy bỏ","x":""},{"t":"k","l":45,"k":"点","h":"điểm","m":"điểm, chấm","n":"占 (chiếm: chiếm) + 灬 (hỏa: lửa) → chiếm chỗ như lửa → điểm. Mẹo: \"Chiếm lửa là điểm\"","ex":"点","r":"ten","em":"điểm","x":""},{"t":"k","l":45,"k":"梅","h":"mai","m":"cây mai","n":"木 (mộc: cây) + 毎 (mỗi: mỗi) → cây mỗi năm đều ra hoa mai → mai. Mẹo: \"Cây mỗi năm là mai\"","ex":"梅","r":"ume","em":"cây mai, quả mai","x":""},{"t":"k","l":45,"k":"番","h":"phiên","m":"số thứ tự, lần","n":"釆 (biện: phân biệt) + 田 (điền: ruộng) → phân biệt ruộng theo số thứ tự → phiên. Mẹo: \"Ruộng phân biệt là phiên\"","ex":"110番","r":"110-ban","em":"số 110 (cấp cứu)","x":""},{"t":"k","l":45,"k":"急","h":"cấp","m":"gấp, khẩn cấp","n":"心 (tâm: tim) + 及 (cập: kịp) → tim kịp gấp → cấp bách. Mẹo: \"Tim kịp gấp là cấp\"","ex":"急に","r":"kyū ni","em":"đột ngột, gấp rút","x":""},{"t":"k","l":45,"k":"無","h":"vô","m":"không, không có","n":"Hình người múa (mượn nghĩa \"không\") → không có. Mẹo: \"Múa rồi không còn\"","ex":"無理に","r":"muri ni","em":"gượng ép, vô lý","x":""},{"t":"k","l":45,"k":"理","h":"lý","m":"lẽ, lý lẽ","n":"王 (vương: ngọc) + 里 (lý: dặm) → ngọc ở dặm → lý lẽ. Mẹo: \"Ngọc dặm là lý\"","ex":"無理に","r":"muri ni","em":"vô lý","x":""},{"t":"k","l":45,"k":"以","h":"dĩ","m":"từ, lấy","n":"亻 (nhân: người) + 乁 (dĩ: đi) → người từ đó đi → từ, để. Mẹo: \"Người đi là dĩ\"","ex":"以上です","r":"ijō desu","em":"trên đây là... (kết thúc)","x":""},{"t":"k","l":45,"k":"上","h":"thượng","m":"trên","n":"Nét phía trên → trên. Mẹo: \"Vạch trên là thượng\"","ex":"以上です","r":"ijō desu","em":"trên đây là...","x":""},{"t":"k","l":46,"k":"渡","h":"độ","m":"chuyển giao, băng qua","n":"氵 (thủy: nước) + 度 (độ: mức) → băng qua nước ở một mức → qua, chuyển giao. Mẹo: \"Nước qua là độ\"","ex":"渡します","r":"watashimasu","em":"gửi, chuyển giao","x":""},{"t":"k","l":46,"k":"帰","h":"quy","m":"về, trở về","n":"止 (chỉ: dừng) + 帚 (chủ: chổi) → dừng quét chổi để về nhà → quy. Mẹo: \"Dừng chổi về là quy\"","ex":"帰って来ます","r":"kaette kimasu","em":"trở về","x":""},{"t":"k","l":46,"k":"来","h":"lai","m":"đến","n":"Hình bông lúa đến → đến, tới. Mẹo: \"Lúa đến là lai\"","ex":"帰って来ます","r":"kaette kimasu","em":"trở về (quy lai)","x":""},{"t":"k","l":46,"k":"出","h":"xuất","m":"ra ngoài, xuất hiện","n":"Hình chân bước ra khỏi hang → đi ra. Mẹo: \"Chân ra hang là xuất\"","ex":"出ます","r":"demasu","em":"xuất phát, ra ngoài","x":""},{"t":"k","l":46,"k":"届","h":"giới","m":"trình, gửi đến","n":"尸 (thi: xác) + 由 (do: từ) → từ xác gửi đến → gửi đến. Mẹo: \"Từ xác gửi đến\"","ex":"届きます","r":"todokimasu","em":"đến nơi, gửi đến","x":""},{"t":"k","l":46,"k":"荷","h":"hà","m":"hàng hóa, hành lý","n":"艸 (thảo: cỏ) + 何 (hà: gì) → gánh cỏ gì → hàng hóa. Mẹo: \"Cỏ gì là hàng\"","ex":"荷物","r":"nimotsu","em":"hành lý, hàng hóa","x":""},{"t":"k","l":46,"k":"物","h":"vật","m":"vật, đồ vật","n":"牛 (ngưu: trâu) + 勿 (vật: đừng) → thịt trâu là vật. Mẹo: \"Thịt trâu là vật\"","ex":"荷物","r":"nimotsu","em":"hành lý (hà vật)","x":""},{"t":"k","l":46,"k":"入","h":"nhập","m":"vào","n":"Hình lưỡi dao đâm vào trong → vào. Mẹo: \"Đâm vào là nhập\"","ex":"入学します","r":"nyūgaku shimasu","em":"nhập học","x":""},{"t":"k","l":46,"k":"学","h":"học","m":"học","n":"Đứa trẻ học trong nhà → học. Mẹo: \"Trẻ học là học\"","ex":"入学します","r":"nyūgaku shimasu","em":"nhập học","x":""},{"t":"k","l":46,"k":"大","h":"đại","m":"lớn","n":"Người giang tay → lớn. Mẹo: \"Giang tay là đại\"","ex":"大学","r":"daigaku","em":"đại học","x":""},{"t":"k","l":46,"k":"卒","h":"tốt","m":"tốt nghiệp, hoàn thành","n":"亠 (đầu) + 从 (tùng: hai người) + 十 (thập: mười) → hai người kết thúc giai đoạn → tốt nghiệp. Mẹo: \"Người kết thúc là tốt\"","ex":"卒業します","r":"sotsugyō shimasu","em":"tốt nghiệp","x":""},{"t":"k","l":46,"k":"業","h":"nghiệp","m":"nghề nghiệp, sự nghiệp","n":"木 (mộc: gỗ) + 业 (nghiệp: việc) → làm việc với gỗ → nghề nghiệp. Mẹo: \"Gỗ làm việc là nghiệp\"","ex":"卒業します","r":"sotsugyō shimasu","em":"tốt nghiệp","x":""},{"t":"k","l":46,"k":"焼","h":"thiêu","m":"nướng, đốt","n":"火 (hỏa: lửa) + 堯 (nghiêu: cao) → lửa cao nướng → thiêu. Mẹo: \"Lửa cao nướng là thiêu\"","ex":"焼きます","r":"yakimasu","em":"nướng, đốt","x":""},{"t":"k","l":46,"k":"焼","h":"thiêu","m":"chín, nướng (nội động từ)","n":"Như trên → tự chín, tự nướng. Mẹo: \"Lửa cao chín\"","ex":"焼けます","r":"yakemasu","em":"chín (bánh), bị cháy","x":""},{"t":"k","l":46,"k":"留","h":"lưu","m":"ở lại, lưu lại","n":"田 (điền: ruộng) + 卯 (mão: mão) → ruộng ở lại → lưu. Mẹo: \"Ruộng ở lại là lưu\"","ex":"留守","r":"rusu","em":"vắng nhà (lưu thủ - ở lại canh nhà)","x":""},{"t":"k","l":46,"k":"守","h":"thủ","m":"giữ gìn, bảo vệ","n":"宀 (miên: nhà) + 寸 (thốn: gang tay) → trong nhà dùng tay giữ → thủ. Mẹo: \"Trong nhà giữ là thủ\"","ex":"留守","r":"rusu","em":"vắng nhà (lưu thủ - ở lại canh nhà)","x":""},{"t":"k","l":46,"k":"宅","h":"trạch","m":"nhà cửa, dinh thự","n":"宀 (miên: nhà) + 乇 (trạch: cái rễ) → nhà có rễ → trạch. Mẹo: \"Nhà có rễ là trạch\"","ex":"宅配便","r":"takuhaibin","em":"dịch vụ giao hàng tận nhà","x":""},{"t":"k","l":46,"k":"配","h":"phối","m":"phân phối, sắp xếp","n":"酉 (dậu: rượu) + 己 (kỷ: mình) → mình phân phối rượu → phối. Mẹo: \"Mình rượu phân phối\"","ex":"宅配便","r":"takuhaibin","em":"dịch vụ giao hàng tận nhà","x":""},{"t":"k","l":46,"k":"便","h":"tiện","m":"tiện lợi, dịch vụ","n":"亻 (nhân: người) + 更 (canh: thay đổi) → người thay đổi để tiện → tiện. Mẹo: \"Người thay đổi là tiện\"","ex":"宅配便","r":"takuhaibin","em":"dịch vụ giao hàng (trạch phối tiện)","x":""},{"t":"k","l":46,"k":"原","h":"nguyên","m":"nguyên nhân, nguồn gốc","n":"厂 (hán: vách đá) + 泉 (tuyền: suối) → suối từ vách đá → nguyên. Mẹo: \"Suối từ đá là nguyên\"","ex":"原因","r":"gen'in","em":"nguyên nhân","x":""},{"t":"k","l":46,"k":"因","h":"nhân","m":"nhân duyên, nguyên nhân","n":"囗 (vi: bao vây) + 大 (đại: lớn) → cái lớn bao vây gây ra nhân. Mẹo: \"Bao vây lớn là nhân\"","ex":"原因","r":"gen'in","em":"nguyên nhân","x":""},{"t":"k","l":46,"k":"所","h":"sở","m":"nơi chốn","n":"戸 (hộ: cửa) + 斤 (cân: rìu) → nơi có cửa và rìu → chỗ. Mẹo: \"Cửa rìu là sở\"","ex":"～の所","r":"～no tokoro","em":"nơi, chỗ của...","x":""},{"t":"k","l":46,"k":"半","h":"bán","m":"một nửa","n":"十 (thập: mười) + 八 (bát: tám) → chia mười ra tám → một nửa. Mẹo: \"Mười chia tám là nửa\"","ex":"半年","r":"hantoshi","em":"nửa năm (bán niên)","x":""},{"t":"k","l":46,"k":"年","h":"niên","m":"năm","n":"Hình người gánh lúa → năm. Mẹo: \"Người gánh lúa là năm\"","ex":"半年","r":"hantoshi","em":"nửa năm (bán niên)","x":""},{"t":"k","l":46,"k":"今","h":"kim","m":"bây giờ","n":"亼 (tập: họp) + 乛 (đầu) → thời điểm đang họp → hiện tại. Mẹo: \"Thời điểm họp là kim\"","ex":"たった今","r":"tatta ima","em":"ngay bây giờ, vừa mới","x":""},{"t":"k","l":47,"k":"吹","h":"xúy","m":"thổi","n":"口 (khẩu: miệng) + 欠 (khiếm: há miệng) → há miệng thổi ra. Mẹo: \"Miệng há thổi là xúy\"","ex":"吹きます","r":"fukimasu","em":"thổi (gió)","x":""},{"t":"k","l":47,"k":"風","h":"phong","m":"gió","n":"凡 (phàm) + 虫 (trùng: sâu bọ) → sâu bọ bay khi có gió. Mẹo: \"Sâu bay là có gió\"","ex":"風が～","r":"kaze ga～","em":"gió thì","x":""},{"t":"k","l":47,"k":"燃","h":"nhiên","m":"cháy, đốt","n":"火 (hỏa: lửa) + 然 (nhiên: tự nhiên) → lửa tự nhiên bùng cháy. Mẹo: \"Lửa tự nhiên cháy\"","ex":"燃えます","r":"moemasu","em":"cháy (rác)","x":""},{"t":"k","l":47,"k":"亡","h":"vong","m":"chết, mất","n":"亠 (đầu) + 乚 (ấn: giấu) → đầu biến mất → chết. Mẹo: \"Đầu mất là vong\"","ex":"亡くなります","r":"nakunarimasu","em":"qua đời, mất","x":""},{"t":"k","l":47,"k":"集","h":"tập","m":"tập hợp, tụ họp","n":"隹 (chuy: chim) + 木 (mộc: cây) → chim tụ về cây → tập hợp. Mẹo: \"Chim về cây tụ tập\"","ex":"集まります","r":"atsumarimasu","em":"tụ họp, tập trung","x":""},{"t":"k","l":47,"k":"人","h":"nhân","m":"người","n":"Hình người đang đứng → người. Mẹo: \"Người đứng là nhân\"","ex":"人が～","r":"hito ga～","em":"người thì","x":""},{"t":"k","l":47,"k":"別","h":"biệt","m":"chia tay, khác","n":"另 (lánh: khác) + 刂 (đao: dao) → dao chia cắt ra khác. Mẹo: \"Dao chia khác là biệt\"","ex":"別れます","r":"wakaremasu","em":"chia tay, biệt ly","x":""},{"t":"k","l":47,"k":"音","h":"âm","m":"âm thanh","n":"立 (lập: đứng) + 日 (nhật: mặt trời) → tiếng dưới mặt trời → âm. Mẹo: \"Tiếng dưới trời là âm\"","ex":"音／声","r":"oto / koe","em":"âm thanh / tiếng nói","x":""},{"t":"k","l":47,"k":"声","h":"thanh","m":"tiếng nói","n":"士 (sĩ: kẻ sĩ) + 尸 (thi: xác) → tiếng từ kẻ sĩ → thanh. Mẹo: \"Kẻ sĩ nói là thanh\"","ex":"音／声","r":"oto / koe","em":"âm thanh / tiếng nói","x":""},{"t":"k","l":47,"k":"味","h":"vị","m":"mùi vị","n":"口 (khẩu: miệng) + 未 (vị: chưa) → miệng chưa nếm tò mò vị. Mẹo: \"Miệng nếm là vị\"","ex":"味が～","r":"aji ga～","em":"vị thì","x":""},{"t":"k","l":47,"k":"厳","h":"nghiêm","m":"nghiêm khắc","n":"厂 (hán: vách đá) + 敢 (cảm: dám) → vách đá dám ngăn cản → nghiêm. Mẹo: \"Vách đá ngăn là nghiêm\"","ex":"厳しい","r":"kibishii","em":"nghiêm khắc","x":""},{"t":"k","l":47,"k":"怖","h":"bố","m":"sợ","n":"忄 (tâm: tim) + 布 (bố: vải) → tim như vải mềm → sợ. Mẹo: \"Tim mềm là sợ\"","ex":"怖い","r":"kowai","em":"đáng sợ","x":""},{"t":"k","l":47,"k":"実","h":"thực","m":"thực tế, thật","n":"宀 (miên: nhà) + 买 (mãi: mua) → mua nhà thực tế → thực. Mẹo: \"Mua nhà là thực\"","ex":"実験","r":"jikken","em":"thí nghiệm (thực nghiệm)","x":""},{"t":"k","l":47,"k":"験","h":"nghiệm","m":"kiểm nghiệm","n":"馬 (mã: ngựa) + 僉 (thiêm: kiểm) → kiểm tra ngựa → nghiệm. Mẹo: \"Kiểm ngựa là nghiệm\"","ex":"実験","r":"jikken","em":"thí nghiệm","x":""},{"t":"k","l":47,"k":"口","h":"khẩu","m":"miệng, khẩu","n":"Hình cái miệng → miệng. Mẹo: \"Cái miệng là khẩu\"","ex":"人口","r":"jinkō","em":"dân số (nhân khẩu)","x":""},{"t":"k","l":47,"k":"科","h":"khoa","m":"môn học, khoa học","n":"禾 (hòa: lúa) + 斗 (đẩu: đấu) → đong lúa theo môn học → khoa. Mẹo: \"Lúa đong là khoa\"","ex":"科学","r":"kagaku","em":"khoa học","x":""},{"t":"k","l":47,"k":"学","h":"học","m":"học","n":"Trẻ học trong nhà → học. Mẹo: \"Trẻ học là học\"","ex":"科学","r":"kagaku","em":"khoa học","x":""},{"t":"k","l":47,"k":"医","h":"y","m":"y học, chữa bệnh","n":"匚 (phương: hộp) + 矢 (thỉ: tên) → hộp đựng tên thuốc → y. Mẹo: \"Hộp tên thuốc là y\"","ex":"医学","r":"igaku","em":"y học","x":""},{"t":"k","l":47,"k":"文","h":"văn","m":"văn học","n":"Hình xăm → chữ viết. Mẹo: \"Xăm là văn\"","ex":"文学","r":"bungaku","em":"văn học","x":""},{"t":"k","l":47,"k":"救","h":"cứu","m":"cứu giúp","n":"攵 (phộc: đánh) + 求 (cầu: xin) → đánh xin cứu giúp → cứu. Mẹo: \"Đánh xin cứu là cứu\"","ex":"救急車","r":"kyūkyūsha","em":"xe cứu thương ","ex":"自由に","r":"jiyū ni","em":"tự do, thoải mái","x":""},{"t":"k","l":48,"k":"由","h":"do","m":"do, từ, lý do","n":"Hình cái bình dầu mỡ → do từ đó → do. Mẹo: \"Bình dầu là do\"","ex":"自由に","r":"jiyū ni","em":"tự do","x":""},{"t":"k","l":48,"k":"間","h":"gian","m":"khoảng thời gian, giữa","n":"門 (môn: cửa) + 日 (nhật: mặt trời) → ánh mặt trời qua cửa → khoảng gian. Mẹo: \"Cửa có trời là gian\"","ex":"～間","r":"～kan","em":"khoảng thời gian","x":""},{"t":"k","l":49,"k":"利","h":"lợi","m":"lợi ích, lợi dụng","n":"禾 (hòa: lúa) + 刂 (đao: dao) → dao cắt lúa mang lại lợi ích → lợi. Mẹo: \"Dao cắt lúa là lợi\"","ex":"利用します","r":"riyō shimasu","em":"sử dụng, lợi dụng","x":""},{"t":"k","l":49,"k":"用","h":"dụng","m":"dùng, sử dụng","n":"Chữ tượng hình: cái vại có thể dùng được → dùng. Mẹo: \"Đồ dùng được là dụng\"","ex":"利用します","r":"riyō shimasu","em":"sử dụng","x":""},{"t":"k","l":49,"k":"勤","h":"cần","m":"làm việc, siêng năng","n":"力 (lực: sức) + 堇 (cần: đất) → dùng sức trên đất để làm việc → cần. Mẹo: \"Sức đất là cần\"","ex":"勤めます","r":"tsutomemasu","em":"làm việc, làm công (hội xã cần)","x":""},{"t":"k","l":49,"k":"会","h":"hội","m":"công ty, hội","n":"亼 (tập: họp) + 云 (vân: nói) → họp nói chuyện → hội. Mẹo: \"Họp nói là hội\"","ex":"会社","r":"kaisha","em":"công ty (hội xã)","x":""},{"t":"k","l":49,"k":"社","h":"xã","m":"xã hội, công ty","n":"礻 (thị: thần) + 土 (thổ: đất) → đất thần xã hội → xã. Mẹo: \"Đất thần là xã\"","ex":"会社","r":"kaisha","em":"công ty","x":""},{"t":"k","l":49,"k":"掛","h":"quải","m":"treo, móc, ngồi lên","n":"扌 (thủ: tay) + 卦 (quái: quẻ bói) → tay bấm quẻ treo lên → quải. Mẹo: \"Tay bấm treo là quải\"","ex":"掛けます","r":"kakemasu","em":"treo, móc, ngồi lên","x":""},{"t":"k","l":49,"k":"過","h":"quá","m":"trải qua, vượt qua","n":"辶 (sước: đi) + 咼 (oa: méo mó) → đi qua chỗ méo mó → vượt qua. Mẹo: \"Đi qua chỗ trắc trở là quá\"","ex":"過ごします","r":"sugoshimasu","em":"trải qua, sống qua","x":""},{"t":"k","l":49,"k":"召","h":"triệu","m":"gọi, mời (kính ngữ)","n":"刀 (đa function norm(s){
  s=(s||'').normalize('NFKC').toLowerCase();
  s=s.replace(/[\u00c0-\u1ef9]/g,c=>c.normalize('NFD').replace(/[\u0300-\u036f]/g,'')).replace(/đ/g,'d');
  s=s.replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  return s.replace(/[~〜～\[\]\(\)（）「」『』＜＞<>・,.;:!?？！、。/／\-–—_'"]/g,' ').replace(/\s+/g,' ').trim();
}
const FIELDS={v:['w','k','h','r','m'],k:['k','h','m','ex','r','em','n','x']};
const WEIGHT={w:3,k:3,h:3,r:2,m:2,ex:2,em:2,n:1,x:1};
items.forEach(e=>{e._n={};FIELDS[e.t].forEach(f=>e._n[f]=norm(e[f]));e._all=Object.values(e._n).join(' | ')});

const kanjiMap={};
D.kanji.forEach(e=>(kanjiMap[e.k]=kanjiMap[e.k]||[]).push(e));
const HANRE=/[\u3400-\u9fff]/g;

const $=id=>document.getElementById(id);
const state={type:'all',lesson:'',q:'',limit:80,sel:null,res:[]};

function search(){
  const toks=norm(state.q).split(' ').filter(Boolean);
  let out=[];
  for(const e of items){
    if(state.type!=='all'&&e.t!==state.type)continue;
    if(state.lesson&&String(e.l)!==state.lesson)continue;
    let score=0;
    if(toks.length){
      let ok=true;
      for(const t of toks){
        if(!e._all.includes(t)){ok=false;break}
        let best=1;
        for(const f of FIELDS[e.t]){
          const v=e._n[f];if(!v)continue;
          const i=v.indexOf(t);if(i<0)continue;
          const w=WEIGHT[f]||1;
          const s=v===t?100:i===0?60:(v[i-1]===' ')?40:15;
          best=Math.max(best,s*w);
        }
        score+=best;
      }
      if(!ok)continue;
      if(e.t==='k')score+=5;
    }
    out.push([score,e]);
  }
  if(toks.length)out.sort((a,b)=>b[0]-a[0]||a[1].id-b[1].id);
  return out.map(x=>x[1]);
}

const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderList(){
  state.res=search();
  const r=state.res,shown=r.slice(0,state.limit);
  $('count').textContent=r.length+' kết quả';
  if(!r.length){$('list').innerHTML='<div class="empty">Không tìm thấy kết quả. Thử gõ ngắn hơn, bỏ dấu, hoặc dùng romaji / hiragana.</div>';return}
  $('list').innerHTML=shown.map(e=>{
    if(e.t==='k')return `<button class="item" data-id="${e.id}" ${state.sel===e.id?'aria-current="true"':''}><div class="big k">${esc(e.k)}</div><div><div class="t1"><span class="tag">Hán tự</span>${esc(e.h)}${e.ex?' · '+esc(e.ex):''}</div><div class="t2">${esc(e.m||e.em)}</div></div></button>`;
    const main=e.k&&!/[\u3040-\u30ff]/.test(e.k)?e.k:(e.w);
    const sm=main.length>5?' sm':'';
    return `<button class="item" data-id="${e.id}" ${state.sel===e.id?'aria-current="true"':''}><div class="big${sm}">${esc(main)}</div><div><div class="t1">${esc(e.w)}${e.h?' · '+esc(e.h):''}</div><div class="t2">${esc(e.m)}${e.r?' — '+esc(e.r):''}</div></div></button>`;
  }).join('')+(r.length>shown.length?`<button class="more" id="more">Hiện thêm (${r.length-shown.length})</button>`:'');
}

const row=(l,v,cls)=>v?`<dt>${l}</dt><dd class="${cls||''}">${esc(v)}</dd>`:'';
function kcard(k){return `<button class="kcard" data-id="${k.id}"><div class="big k">${esc(k.k)}</div><div><div class="t1">${esc(k.h)}${k.m?' — '+esc(k.m):''}</div><div class="t2">${esc(k.n)}</div></div></button>`}
function relVocab(ch,self){
  const rel=D.vocab.filter(v=>v!==self&&((v.k&&v.k.includes(ch))||v.w.includes(ch))).slice(0,30);
  return rel.length?`<h3>Từ vựng có chứa ${esc(ch)}</h3><div class="rel">${rel.map(v=>`<button data-id="${v.id}"><span class="jp">${esc(v.w)}</span><small>${esc(v.m)}</small></button>`).join('')}</div>`:'';
}
function renderDetail(){
  const e=items[state.sel];const el=$('detail');
  if(!e){el.innerHTML='<div class="empty">Chọn một mục trong danh sách để xem chi tiết.</div>';return}
  let h='';
  if(e.t==='k'){
    h+=`<p class="dword k">${esc(e.k)}</p><p class="dsub">Hán tự · Bài ${e.l}</p><dl>${row('Âm Hán',e.h)}${row('Nghĩa',e.m)}${row('Cách nhớ',e.n)}${row('Ví dụ',e.ex,'jp')}${row('Cách đọc',e.r)}${row('Nghĩa ví dụ',e.em)}${row('Ghi chú',e.x)}</dl>`;
    const same=(kanjiMap[e.k]||[]).filter(k=>k!==e);
    if(same.length)h+=`<h3>Mục khác của ${esc(e.k)}</h3><div class="chars">${same.map(kcard).join('')}</div>`;
    h+=relVocab(e.k,null);
  }else{
    h+=`<p class="dword">${esc(e.k||e.w)}</p><p class="dsub">${e.k?esc(e.w):'&nbsp;'}</p><dl>${row('Từ vựng',e.w,'jp')}${row('Hán tự',e.k,'jp')}${row('Âm Hán',e.h)}${row('Phát âm',e.r)}${row('Nghĩa',e.m)}${row('Vị trí','Bài '+e.l+(e.s?' · '+e.s:'')+' · PDF trang '+e.p)}</dl>`;
    const chars=[...new Set(((e.k||'')+(e.w.match(HANRE)||[]).join('')).match(HANRE)||[])];
    const found=chars.flatMap(c=>kanjiMap[c]||[]);
    if(found.length)h+=`<h3>Chữ Hán trong từ này</h3><div class="chars">${found.map(kcard).join('')}</div>`;
    const first=chars[0];
    if(first)h+=relVocab(first,e);
  }
  el.innerHTML=h;el.scrollTop=0;
}
function select(id,push){
  state.sel=id;renderDetail();
  document.querySelectorAll('.item').forEach(b=>b.toggleAttribute('aria-current',+b.dataset.id===id));
  document.querySelectorAll('.item[aria-current]').forEach(b=>b.setAttribute('aria-current','true'));
  document.body.classList.add('show-detail');
  if(push!==false)history.replaceState(null,'','#'+id);
}
function closeDetail(){document.body.classList.remove('show-detail')}

$('q').addEventListener('click',closeDetail);
$('q').addEventListener('input',e=>{closeDetail();state.q=e.target.value;state.limit=80;renderList();$('list').scrollTop=0});
$('list').addEventListener('click',e=>{
  if(e.target.id==='more'){state.limit+=120;renderList();return}
  const b=e.target.closest('.item');if(b)select(+b.dataset.id);
});
$('detail').addEventListener('click',e=>{
  const b=e.target.closest('[data-id]');if(b){select(+b.dataset.id);}
});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

renderList();renderDetail();
const m=location.hash.match(/^#(\d+)$/);
if(m&&items[+m[1]]){select(+m[1],false)}
if(!document.body.classList.contains('show-detail')){}
</script>
</body>
</html>
