<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tra từ vựng tiếng Nhật N5–N4</title>
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#17202b;--mute:#5d6b7c;--line:#dde3ea;--accent:#1d4f91;--accent-soft:#e3edf9;--mark:#ffe58a;--kan:#b3402a;
--jp:"Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP","MS Mincho",serif;
--ui:system-ui,-apple-system,"Segoe UI","Be Vietnam Pro",Roboto,"Hiragino Sans","Yu Gothic UI","Noto Sans CJK JP",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--panel:#18202a;--ink:#e8edf3;--mute:#93a1b2;--line:#2a3441;--accent:#7fb0ee;--accent-soft:#1f2f45;--mark:#5a4a10;--kan:#f08a73}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:0 16px}
header{padding:18px 0 10px}
h1{font-size:1.05rem;margin:0 0 10px;font-weight:600;color:var(--mute)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font-size:1.15rem;padding:13px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
.search input::-webkit-search-cancel-button{cursor:pointer}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--panel);padding:5px 13px;border-radius:99px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
select{padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:.9rem}
.count{color:var(--mute);font-size:.88rem}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:16px;padding-bottom:16px}
.list,.detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;min-height:0}
.item{display:grid;grid-template-columns:3.6rem 1fr;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px;cursor:pointer}
.item:hover{background:var(--accent-soft)}
.item[aria-current=true]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.big{font-family:var(--jp);font-size:1.55rem;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.big.sm{font-size:1rem}
.big.k{color:var(--kan)}
.t1{font-weight:600;overflow-wrap:anywhere}
.t2{color:var(--mute);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{font-size:.72rem;border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:6px;color:var(--mute);vertical-align:1px}
.more{display:block;margin:12px auto;padding:8px 18px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.empty{padding:36px 22px;color:var(--mute)}
.detail{padding:26px 30px}
.dword{font-family:var(--jp);font-size:2.9rem;line-height:1.25;margin:0;overflow-wrap:anywhere}
.dword.k{font-size:6rem;color:var(--kan);line-height:1.1}
.dsub{color:var(--mute);margin:2px 0 18px}
dl{display:grid;grid-template-columns:8.5rem 1fr;gap:10px 16px;margin:0}
dt{color:var(--mute);font-size:.9rem;padding-top:2px}
dd{margin:0;white-space:pre-line;overflow-wrap:anywhere}
dd.jp{font-family:var(--jp);font-size:1.25rem}
h3{font-size:.95rem;margin:28px 0 8px;color:var(--mute);font-weight:600}
.chars{display:grid;gap:8px}
.kcard{display:grid;grid-template-columns:3.2rem 1fr;gap:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:none;cursor:pointer;width:100%}
.kcard:hover{background:var(--accent-soft)}
.rel{display:flex;flex-wrap:wrap;gap:8px}
.rel button{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;cursor:pointer;text-align:left}
.rel button:hover{background:var(--accent-soft)}
.rel .jp{font-family:var(--jp);font-size:1.05rem}
.rel small{display:block;color:var(--mute)}
mark{background:var(--mark);color:inherit;border-radius:3px}
@media (max-width:860px){
 main{display:block}
 .list,.detail{height:100%}
 .detail{display:none;padding:18px}
 body.show-detail .detail{display:block}
 body.show-detail .list{display:none}
 dl{grid-template-columns:1fr;gap:2px 0}dt{margin-top:10px}
 .dword{font-size:2.2rem}.dword.k{font-size:5rem}
}
</style>
</head>
<body>
<div class="app">
 <header>
  <h1>Tra từ vựng tiếng Nhật</h1>
  <div class="search"><input id="q" type="search" placeholder="Gõ tiếng Nhật, tiếng Việt, âm Hán, chữ Hán hoặc romaji…" autocomplete="off" autofocus aria-label="Tìm kiếm"></div>
  <div class="filters">
   <span class="count" id="count" aria-live="polite"></span>
  </div>
 </header>
 <main>
  <div class="list" id="list"></div>
  <article class="detail" id="detail"></article>
 </main>
</div>

lại cho người khác → \"Người nói lại là truyền\"","ex":"伝えます","r":"tsutaemasu","em":"truyền đạt, kể lại","x":""},{"t":"k","l":33,"k":"注","h":"chú","m":"chú ý, đổ vào","n":"氵 (thủy: nước) + 主 (chủ: chính, chủ yếu) → đổ nước chính xác vào chỗ → tập trung → \"Đổ nước chính xác là chú tâm\"","ex":"注意します","r":"chūi shimasu","em":"chú ý","x":""},{"t":"k","l":33,"k":"意","h":"ý","m":"ý tứ, suy nghĩ","n":"音 (âm: âm thanh) + 心 (tâm: trái tim) → âm thanh từ tim → ý nghĩ trong lòng → \"Âm thanh từ tim là ý\"","ex":"注意します","r":"chūi shimasu","em":"chú ý","x":""},{"t":"k","l":33,"k":"外","h":"ngoại","m":"bên ngoài, cởi ra","n":"夕 (tịch: chiều tối) + 卜 (bốc: bói toán) → buổi tối đi ra ngoài xem bói → \"Tối ra ngoài là ngoại\"","ex":"外します","r":"hazushimasu","em":"tháo ra, bỏ ra, cởi","x":""},{"t":"k","l":33,"k":"戻","h":"lệ","m":"quay lại, trở lại","n":"戸 (hộ: cửa) + 大 (đại: lớn) → người lớn bước qua cửa quay lại → \"Qua cửa quay lại là lệ\"","ex":"戻ります","r":"modorimasu","em":"quay trở lại","x":""},{"t":"k","l":33,"k":"電","h":"điện","m":"điện, sét","n":"雨 (vũ: mưa) + 申 (thân: kéo dài) → mưa kéo dài tia chớp → \"Mưa kéo dài thành sét\"","ex":"電話","r":"denwa","em":"điện thoại","x":""},{"t":"k","l":33,"k":"話","h":"thoại","m":"lời nói, nói chuyện","n":"言 (ngôn: lời) + 舌 (thiệt: lưỡi) → lời từ lưỡi phát ra → \"Lưỡi nói lời là thoại\"","ex":"電話","r":"denwa","em":"điện thoại","x":""},{"t":"k","l":33,"k":"同","h":"đồng","m":"giống nhau, cùng","n":"冂 + 一 + 口 → một miệng nói giống nhau → \"Một miệng như nhau là đồng\"","ex":"同じ","r":"onaji","em":"giống nhau","x":""},{"t":"k","l":33,"k":"警","h":"cảnh","m":"cảnh giác, báo động","n":"敬 (kính: kính trọng) + 言 (ngôn: lời) → lời kính báo → cảnh báo","ex":"警察","r":"keisatsu","em":"cảnh sát","x":""},{"t":"k","l":33,"k":"察","h":"sát","m":"quan sát, xét nét","n":"宀 (miên: nhà) + 祭 (tế: tế lễ) → trong nhà làm lễ xem xét kỹ → sát hạch","ex":"警察","r":"keisatsu","em":"cảnh sát","x":""},{"t":"k","l":33,"k":"締","h":"đế","m":"cột, buộc, thắt chặt","n":"糸 (mịch: tơ) + 帝 (đế: vua) → sợi tơ của vua buộc chặt mọi thứ → \"Tơ vua buộc là đế\"","ex":"締め切り","r":"shimekiri","em":"hạn chót, cắt buộc","x":""},{"t":"k","l":33,"k":"切","h":"thiết","m":"cắt, nhất định","n":"七 (thất: bảy) + 刀 (dao: dao) → dao cắt ra bảy phần → \"Dao cắt bảy là thiết\"","ex":"締め切り","r":"shimekiri","em":"hạn chót","x":""},{"t":"k","l":33,"k":"規","h":"quy","m":"quy tắc, điều lệ","n":"夫 (phu: đàn ông) + 見 (kiến: thấy) → đàn ông thấy rõ ràng, phải theo → quy tắc","ex":"規則","r":"kisoku","em":"quy tắc","x":""},{"t":"k","l":33,"k":"則","h":"tắc","m":"nguyên tắc, phép tắc","n":"貝 (bối: tiền) + 刂 (đao: dao) → dùng dao khắc lên tiền → quy tắc cố định","ex":"規則","r":"kisoku","em":"quy tắc","x":""},{"t":"k","l":33,"k":"危","h":"nguy","m":"nguy hiểm","n":"⺈ + 厂 + 巳 → người đứng trên vách đá (厂) đã (巳) sắp ngã → \"Trên vách đá là nguy\"","ex":"危険","r":"kiken","em":"nguy hiểm","x":""},{"t":"k","l":33,"k":"険","h":"hiểm","m":"hiểm trở, nguy hiểm","n":"阝 (phụ: núi) + 僉 (thiêm: cùng nhau) → núi cùng nhau chồng chất → hiểm trở","ex":"危険","r":"kiken","em":"nguy hiểm","x":""},{"t":"k","l":33,"k":"使","h":"sử","m":"sử dụng","n":"亻 (nhân: người) + 吏 (lại: quan lại) → người sai bảo quan lại → dùng người","ex":"使用","r":"shiyō","em":"sử dụng","x":""},{"t":"k","l":33,"k":"用","h":"dụng","m":"dùng, sử dụng","n":"chữ tượng hình: cái vại có thể dùng được → \"Đồ dùng được là dụng\"","ex":"使用","r":"shiyō","em":"sử dụng","x":""},{"t":"k","l":33,"k":"禁","h":"cấm","m":"cấm chỉ","n":"林 (lâm: rừng) + 示 (thị: chỉ bảo) → trong rừng có bảng chỉ dẫn cấm → \"Rừng có biển bảo là cấm\"","ex":"禁止","r":"kinshi","em":"cấm chỉ","x":""},{"t":"k","l":33,"k":"止","h":"chỉ","m":"dừng, ngừng","n":"hình bàn chân đứng yên → \"Chân dừng là ngừng\"","ex":"禁止","r":"kinshi","em":"cấm chỉ","x":""},{"t":"k","l":33,"k":"立","h":"lập","m":"đứng, thiết lập","n":"hình người đứng trên mặt đất → \"Người đứng thẳng là lập\"","ex":"立入","r":"tachiiri","em":"đứng vào, bước vào","x":""},{"t":"k","l":33,"k":"入","h":"nhập","m":"vào","n":"hình lưỡi dao đâm vào trong → \"Vào trong là nhập\"","ex":"立入","r":"tachiiri","em":"bước vào","x":""},{"t":"k","l":33,"k":"徐","h":"từ","m":"chậm rãi, từ từ","n":"彳 (sách: bước chân) + 余 (dư: thừa) → bước chân thừa ra, chậm lại → \"Bước dư ra là chậm\"","ex":"徐行","r":"jokō","em":"đi chậm","x":""},{"t":"k","l":33,"k":"口","h":"khẩu","m":"miệng, cửa, lối","n":"hình cái miệng → \"Cái miệng là khẩu\"","ex":"入口","r":"iriguchi","em":"lối vào","x":""},{"t":"k","l":33,"k":"非","h":"phi","m":"chẳng phải, sai trái","n":"giống hai cánh chim dang ra đối lập → \"Đối lập là phi\"","ex":"非常","r":"hijō","em":"bất thường, khẩn cấp","x":""},{"t":"k","l":33,"k":"常","h":"thường","m":"bình thường, thường xuyên","n":"尚 (thượng: cao) + 巾 (cân: vải) → tấm vải thường ngày ở trên cao → bình thường","ex":"非常","r":"hijō","em":"bất thường","x":""},{"t":"k","l":33,"k":"無","h":"vô","m":"không, không có","n":"chữ tượng hình: người nhảy múa (ban đầu nghĩa là múa, sau mượn nghĩa \"không\") → \"Múa rồi không còn gì\"","ex":"無料","r":"muryō","em":"miễn phí","x":""},{"t":"k","l":33,"k":"料","h":"liệu","m":"tiền công, vật liệu","n":"米 (mễ: gạo) + 斗 (đẩu: cái đấu) → đong gạo bằng đấu → tính tiền","ex":"無料","r":"muryō","em":"miễn phí","x":""},{"t":"k","l":33,"k":"割","h":"cát","m":"cắt, chia, giảm","n":"害 (hại: tai hại) + 刂 (đao: dao) → dao cắt cái hại → chia cắt, giảm","ex":"割引","r":"waribiki","em":"giảm giá","x":""},{"t":"k","l":33,"k":"引","h":"dẫn","m":"kéo, rút, dẫn","n":"弓 (cung: cây cung) + 丨 (nét thẳng) → kéo căng cung ra → kéo, dẫn","ex":"割引","r":"waribiki","em":"giảm giá","x":""},{"t":"k","l":33,"k":"飲","h":"ẩm","m":"uống","n":"食 (thực: ăn) + 欠 (khiếm: thiếu, há miệng) → há miệng thiếu nước thì uống → \"Miệng thiếu nước là uống\"","ex":"飲み放題","r":"nomihōdai","em":"uống thỏa thích","x":""},{"t":"k","l":33,"k":"放","h":"phóng","m":"thả ra, buông, phóng","n":"方 (phương: vuông) + 攵 (phộc: đánh) → đánh cho phương qua bên kia → thả ra","ex":"飲み放題","r":"nomihōdai","em":"uống thỏa thích","x":""},{"t":"k","l":33,"k":"題","h":"đề","m":"chủ đề, đề mục","n":"是 (thị: đúng) + 頁 (hiệt: đầu) → cái đầu đúng → chủ đề","ex":"飲み放題","r":"nomihōdai","em":"uống thỏa thích","x":""},{"t":"k","l":33,"k":"募","h":"mộ","m":"quyên góp, chiêu mộ","n":"力 (lực: sức) + 莫 (mạc: không) → ra sức kêu gọi không ngừng → \"Ra sức kêu gọi là mộ\"","ex":"募集中","r":"boshūchū","em":"đang tuyển","x":""},{"t":"k","l":33,"k":"集","h":"tập","m":"tụ tập, gom lại","n":"隹 (chuy: chim) + 木 (mộc: cây) → chim tụ về cây → \"Chim về cây là tụ tập\"","ex":"募集中","r":"boshūchū","em":"đang tuyển","x":""},{"t":"k","l":34,"k":"載","h":"tải","m":"đăng tải, chở","n":"車 (xe) + 哉 (tai – khởi đầu / làm) = 載 (CHỞ / GHI / BẮT ĐẦU ĐƯA LÊN PHƯƠNG TIỆN)","ex":"載（の）せます","r":"nosemasu","em":"để/đặt lên","x":""},{"t":"k","l":34,"k":"印","h":"ấn","m":"dấu, con dấu; in ấn","n":"卩 (tiết: đầu gối người, tượng trưng cho người quỳ) + 爪 (trảo: tay) → tay ấn lên đầu người quỳ để ra dấu lệnh → cái ấn, in dấu. Mẹo: \"Tay ấn đầu người quỳ là con dấu\"","ex":"印を押す","r":"in o osu","em":"đóng dấu","x":""},{"t":"k","l":34,"k":"線","h":"tuyến","m":"đường kẻ, đường dây, sợi chỉ","n":"糸 (mịch: tơ nhỏ) + 泉 (tuyền: suối nước) → sợi tơ mảnh và dài như dòng suối (泉) → đường kéo dài, đường dây. Mẹo: \"Tơ như suối là đường tuyến\"","ex":"電車の線","r":"densha no sen","em":"đường tàu điện","x":""},{"t":"k","l":34,"k":"黄","h":"hoàng","m":"màu vàng","n":"Chữ tượng hình: giữa có chữ 田 (điền: ruộng) + bộ 艸 (thảo: cỏ?) + 八 (bát: tám) → lúa chín vàng. Cách nhớ: \"Ruộng lúa chín vàng\". Ở Nhật viết giản lược thành 黄 (không có 八). Mẹo: \"Ruộng lúa chín → màu vàng\"","ex":"黄色","r":"kiiro","em":"màu vàng","x":""},{"t":"k","l":34,"k":"塩","h":"diêm","m":"muối","n":"","ex":"食塩","r":"shokuen","em":"muối ăn","x":""},{"t":"k","l":34,"k":"矢","h":"thỉ","m":"mũi tên","n":"giống chữ 失 - thất","ex":"矢印","r":"yajirushi","em":"mũi tên chỉ dẫn","x":""},{"t":"k","l":34,"k":"甘","h":"cam","m":"ngọt","n":"Chữ tượng hình: Hình cái miệng (口) ngậm vật gì đó ngọt, thêm nét ngang (一) chỉ vật ngọt trong miệng. Mẹo: \"Miệng có vật ngọt → vị ngọt\"","ex":"甘い","r":"amai","em":"ngọt","x":""},{"t":"k","l":34,"k":"苦","h":"khổ","m":"đắng; khổ sở, vất vả","n":"艸 (thảo: cỏ) + 古 (cổ: cũ xưa) → cỏ cũ có vị đắng → vị đắng; từ vị đắng chuyển sang cảm giác khổ cực. Mẹo: \"Cỏ xưa đắng → đắng khổ\"","ex":"苦い","r":"nigai","em":"đắng","x":""},{"t":"k","l":34,"k":"答","h":"đáp","m":"trả lời","n":"竹 (trúc: tre) + 合 (hợp: khớp, gộp lại) → gộp các thanh tre lại thành một cặp (trúc thư) để viết câu trả lời; hoặc \"mỗi câu hỏi đều có lời đáp khớp lại như tre ghép\". Mẹo: \"Tre gộp lại là câu trả lời\"","ex":"答え","r":"kotae","em":"câu trả lời","x":""},{"t":"k","l":34,"k":"質","h":"chất","m":"chất lượng; nội dung; bản chất","n":"斤 (cân: rìu, dao) + 貝 (bối: tiền, của cải) + 斦 (đãn: cái đe) → dùng dao rìu kiểm tra của cải trên cái đe để xem chất lượng. Mẹo: \"Kiểm tra của cải để biết chất lượng\"","ex":"質","r":"shitsu","em":"chất lượng","x":""},{"t":"k","l":34,"k":"練","h":"luyện","m":"luyện tập; rèn luyện","n":"糸 (mịch: tơ) + 東 (đông: hướng đông – từ đơn giản), thực tế 東 ở đây biến thể từ 柬 (giản: chọn lọc, rèn) → kéo sợi tơ qua lại nhiều lần để làm mềm và chắc → rèn luyện. Mẹo: \"Kéo tơ rèn sợi là luyện tập\"","ex":"練習","r":"renshū","em":"luyện tập","x":""},{"t":"k","l":34,"k":"製","h":"chế","m":"chế tạo, sản xuất","n":"衣 (y: quần áo) + 制 (chế: chế định, quy định) → cắt may quần áo theo quy định → chế tạo, sản xuất. Mẹo: \"May áo theo lệ là chế tạo\"","ex":"製品","r":"seihin","em":"sản phẩm","x":""},{"t":"k","l":34,"k":"故","h":"cố","m":"nguyên nhân; việc cũ; cố ý","n":"古 (cổ: cũ) + 攵 (phộc: đánh, tác động) → tác động vào cái cũ → nguyên nhân từ việc cũ. Mẹo: \"Tác động vào cũ là nguyên nhân\"","ex":"故障","r":"koshō","em":"sự cố, hỏng hóc","x":""},{"t":"k","l":34,"k":"障","h":"chướng","m":"cản trở, ngăn chặn; sự cố","n":"阝 (phụ: núi đất) + 章 (chương: chương mục, rõ ràng) → núi đất chặn đường rõ ràng → cản trở. Mẹo: \"Núi chặn đường rõ là chướng ngại\"","ex":"故障","r":"koshō","em":"sự cố, hỏng hóc","x":""},{"t":"k","l":34,"k":"転","h":"chuyển","m":"xoay chuyển, lăn, đổi hướng","n":"車 (xa: xe) + 云 (vân: nói) → chiếc xe \"nói\" rằng nó sắp quay đầu → chuyển động, lăn bánh, đổi hướng. Mẹo: \"Xe nói quay đầu là chuyển\"","ex":"転ぶ","r":"korobu","em":"ngã, lăn ra","x":""},{"t":"k","l":34,"k":"決","h":"quyết","m":"quyết định; quyết tâm","n":"氵 (thủy: nước) + 夬 (quái: quyết, gãy) → nước vỡ đê chảy qua khe hở → tách bạch, dứt khoát → quyết định. Mẹo: \"Nước vỡ đê dứt khoát là quyết\"","ex":"決める","r":"kimeru","em":"quyết định","x":""},{"t":"k","l":34,"k":"眼","h":"nhãn","m":"mắt","n":"目 (mục: mắt) + 艮 (cấn: dừng, vững) → con mắt đứng vững, nhìn tập trung → nhãn cầu, mắt. Mẹo: \"Mắt đứng vững là nhãn\"","ex":"眼鏡","r":"megane","em":"kính mắt","x":""},{"t":"k","l":34,"k":"鏡","h":"kính","m":"gương; kính (quang học)","n":"金 (kim: kim loại) + 竟 (cảnh: kết thúc, chỗ giáp ranh) → đồ kim loại ở ranh giới phản chiếu hình ảnh → gương soi, kính. Mẹo: \"Kim loại ranh giới soi là gương\"","ex":"眼鏡","r":"megane","em":"kính mắt","x":""},{"t":"k","l":34,"k":"降","h":"hàng/giáng","m":"rơi xuống, hạ xuống; đầu hàng","n":"阝 (phụ: núi) + 夅 (giáng: rơi) → bước xuống núi → đi xuống, hạ xuống. Nghĩa đầu hàng từ \"hạ cờ xuống\". Mẹo: \"Xuống núi là giáng/hàng\"","ex":"降水","r":"kōsui","em":"mưa rơi, lượng mưa","x":""},{"t":"k","l":35,"k":"咲","h":"tiếu","m":"nở hoa, cười","n":"口 (khẩu: miệng) + 关 (quan: liên quan, khép kín) — hình ảnh miệng hoa hé mở như đang cười → hoa nở. Mẹo: \"Miệng hoa cười là nở hoa\"","ex":"咲きます","r":"sakimasu","em":"nở hoa","x":""},{"t":"k","l":35,"k":"花","h":"hoa","m":"bông hoa","n":"艸 (thảo: cỏ) + 化 (hóa: biến hóa) — cỏ cây biến hóa thành bông hoa đẹp. Mẹo: \"Cỏ hóa hoa\"","ex":"花が～","r":"hana ga～","em":"hoa thì","x":""},{"t":"k","l":35,"k":"変","h":"biến","m":"thay đổi, biến đổi","n":"亦 (diệc: cũng) + 攵 (phộc: đánh) — đánh sang hướng khác làm cho mọi thứ \"cũng\" khác đi → biến đổi. Mẹo: \"Đánh cũng khác là biến\"","ex":"変わります","r":"kawarimasu","em":"thay đổi","x":""},{"t":"k","l":35,"k":"困","h":"khốn","m":"khốn khó, khó khăn","n":"口 (khẩu: miệng) + 木 (mộc: cây) — miệng bị cây cản trở, không thoát ra được → khốn khó. Mẹo: \"Miệng kẹt cây là khốn\"","ex":"困ります","r":"komarimasu","em":"gặp khó khăn, lo lắng","x":""},{"t":"k","l":35,"k":"治","h":"trị","m":"chữa bệnh, trị liệu","n":"氵 (thủy: nước) + 台 (đài: đài, nền) — dùng nước như thuốc để trị bệnh từ nền tảng. Mẹo: \"Nước trên nền là trị bệnh\"","ex":"治ります","r":"naorimasu","em":"khỏi bệnh, lành","x":""},{"t":"k","l":35,"k":"直","h":"trực","m":"thẳng, trực tiếp, sửa chữa","n":"十 (thập: mười) + 目 (mục: mắt) + 一 (nhất: một) — mười mắt nhìn thẳng một hướng → thẳng. Mẹo: \"Mười mắt nhìn thẳng là trực\"","ex":"直ります","r":"naorimasu","em":"sửa chữa, sửa xong","x":""},{"t":"k","l":35,"k":"力","h":"lực","m":"sức mạnh, lực","n":"hình cánh tay đang gồng cơ bắp → sức mạnh. Mẹo: \"Tay gồng cơ là lực\"","ex":"入力します","r":"nyūryoku shimasu","em":"nhập lực (dữ liệu)","x":""},{"t":"k","l":35,"k":"正","h":"chính","m":"đúng, chính xác","n":"一 (nhất: một) + 止 (chỉ: dừng) — dừng lại đúng một chỗ → chính xác. Mẹo: \"Một chỗ dừng là chính\"","ex":"正しい","r":"tadashii","em":"đúng đắn","x":""},{"t":"k","l":35,"k":"向","h":"hướng","m":"hướng, phía, về phía","n":"宀 (miên: mái nhà) + 口 (khẩu: miệng) — cái miệng trong nhà quay về hướng nào đó. Mẹo: \"Miệng trong nhà chỉ hướng\"","ex":"向こう","r":"mukō","em":"phía bên kia, hướng kia","x":""},{"t":"k","l":35,"k":"島","h":"đảo","m":"hòn đảo","n":"山 (sơn: núi) + 鳥 (điểu: chim) — núi có chim bay về là đảo. Mẹo: \"Núi có chim là đảo\"","ex":"島","r":"shima","em":"hòn đảo","x":""},{"t":"k","l":35,"k":"港","h":"cảng","m":"cảng","n":"氵 (thủy: nước) + 巷 (hạng: ngõ hẻm) — nước chảy vào ngõ là cảng. Mẹo: \"Nước vào ngõ là cảng biển\"","ex":"港","r":"minato","em":"cảng","x":""},{"t":"k","l":35,"k":"海","h":"hải","m":"biển","n":"氵 (thủy: nước) + 毎 (mỗi: mỗi) — nước ở mỗi nơi đều là biển cả. Mẹo: \"Mỗi nước là biển\"","ex":"海外","r":"kaigai","em":"nước ngoài (hải ngoại)","x":""},{"t":"k","l":35,"k":"外","h":"ngoại","m":"bên ngoài","n":"夕 (tịch: chiều) + 卜 (bốc: bói) — buổi chiều ra ngoài xem bói. Mẹo: \"Chiều ra ngoài xem bói là ngoại\"","ex":"海外","r":"kaigai","em":"hải ngoại (nước ngoài)","x":""},{"t":"k","l":35,"k":"登","h":"đăng","m":"leo, trèo, đăng ký","n":"癶 (bát: bước chân) + 豆 (đậu: hạt đậu) — bước chân lên đậu (đồ vật) để leo lên. Mẹo: \"Chân bước lên đậu là leo\"","ex":"山登り","r":"yamanobori","em":"leo núi","x":""},{"t":"k","l":35,"k":"歴","h":"lịch","m":"lịch sử, trải qua","n":"厂 (hán: vách đá) + 秝 (lịch: hạt lúa đều đặn) — đá khắc dấu thời gian trôi qua. Mẹo: \"Đá khắc dấu thời gian là lịch\"","ex":"歴史","r":"rekishi","em":"lịch sử","x":""},{"t":"k","l":35,"k":"史","h":"sử","m":"sử sách, ghi chép","n":"口 (khẩu: miệng) + 亅 (quyết: nét móc) — miệng kể chuyện xưa → sử sách. Mẹo: \"Miệng kể chuyện xưa là sử\"","ex":"歴史","r":"rekishi","em":"lịch sử","x":""},{"t":"k","l":35,"k":"機","h":"cơ","m":"máy móc, cơ hội","n":"木 (mộc: gỗ) + 幾 (kỷ: mấy, bao nhiêu) — cỗ máy bằng gỗ gồm nhiều bộ phận (bao nhiêu?) → máy móc, cơ hội. Mẹo: \"Gỗ bao nhiêu cũng thành máy\"","ex":"機会","r":"kikai","em":"cơ hội","x":""},{"t":"k","l":35,"k":"会","h":"hội","m":"hội họp, cơ hội","n":"亼 (tập: họp) + 云 (vân: nói) — nói chuyện cùng nhau trong buổi họp. Mẹo: \"Họp nói là cơ hội gặp gỡ\"","ex":"機会","r":"kikai","em":"cơ hội","x":""},{"t":"k","l":35,"k":"許","h":"hứa","m":"cho phép, hứa","n":"言 (ngôn: lời) + 午 (ngọ: giữa trưa) — nói lời vào buổi trưa để giao ước, hứa hẹn, cho phép. Mẹo: \"Lời lúc trưa là hứa cho phép\"","ex":"許可","r":"kyoka","em":"sự cho phép","x":""},{"t":"k","l":35,"k":"可","h":"khả","m":"có thể, được phép","n":"丁 (đinh: cái đinh) + 口 (khẩu: miệng) — miệng nói \"đinh\" là được → khả năng, có thể. Mẹo: \"Miệng nói đinh là được phép\"","ex":"許可","r":"kyoka","em":"sự cho phép","x":""},{"t":"k","l":35,"k":"設","h":"thiết","m":"thiết lập, đặt ra","n":"言 (ngôn: lời) + 殳 (thù: khí giới) — nói lên phương án rồi \"thiết\" lập dùng khí giới → đặt ra, bày ra. Mẹo: \"Nói dùng khí giới là thiết bị\"","ex":"設備","r":"setsubi","em":"thiết bị","x":""},{"t":"k","l":35,"k":"備","h":"bị","m":"chuẩn bị, sẵn sàng","n":"亻 (nhân: người) + 備 (bị: trang bị) — người mang theo dụng cụ để sẵn sàng. Mẹo: \"Người mang đồ sẵn là chuẩn bị\"","ex":"設備","r":"setsubi","em":"thiết bị","x":""},{"t":"k","l":35,"k":"炊","h":"xuy","m":"nấu cơm, thổi cơm","n":"火 (hỏa: lửa) + 欠 (khiếm: thiếu, hà hơi) — dùng lửa hà hơi để nấu chín. Mẹo: \"Lửa hà hơi là nấu cơm\"","ex":"炊飯器","r":"suihanki","em":"nồi cơm điện","x":""},{"t":"k","l":35,"k":"飯","h":"phạn","m":"cơm","n":"食 (thực: ăn) + 反 (phản: trái lại) — lật trái thức ăn thành cơm. Mẹo: \"Lật ăn thành cơm\"","ex":"炊飯器","r":"suihanki","em":"nồi cơm điện","x":""},{"t":"k","l":35,"k":"器","h":"khí","m":"dụng cụ, khí cụ","n":"口 (khẩu: miệng) + 口 + 犬 (khuyển: chó) — nhiều miệng, con chó canh giữ đồ vật → đồ dùng. Mẹo: \"Chó canh nhiều miệng đồ là khí cụ\"","ex":"炊飯器","r":"suihanki","em":"nồi cơm điện","x":""},{"t":"k","l":35,"k":"葉","h":"diệp","m":"lá cây","n":"艸 (thảo: cỏ) + 世 (thế: thế giới) + 木 (mộc: cây) — cỏ và cây trên thế giới đều có lá. Mẹo: \"Cỏ cây thế giới có lá\"","ex":"葉","r":"ha","em":"lá cây","x":""},{"t":"k","l":36,"k":"事","h":"sự","m":"việc, sự việc","n":"亠 (đầu) + 口 (khẩu: miệng) + 亅 (quyết: nét móc) — hình ảnh tay cầm bút ghi chép công việc → sự việc. Mẹo: \"Ghi chép việc là sự\"","ex":"事故","r":"jiko","em":"tai nạn, sự cố","x":""},{"t":"k","l":36,"k":"故","h":"cố","m":"nguyên nhân, việc cũ","n":"古 (cổ: cũ) + 攵 (phộc: đánh, tác động) — tác động vào cái cũ để tìm nguyên nhân. Mẹo: \"Tác động vào cũ là nguyên nhân\"","ex":"事故","r":"jiko","em":"tai nạn, sự cố","x":""},{"t":"k","l":36,"k":"遇","h":"ngộ","m":"gặp gỡ, gặp phải","n":"辶 (sước: đi) + 禺 (ngu: vượn, con khỉ) — đi đường gặp khỉ → gặp gỡ. Mẹo: \"Đi gặp khỉ là ngộ\"","ex":"会います","r":"aimasu","em":"gặp (không có chữ 遇 trong ví dụ này, nhưng 会 là hội/hợp)","x":""},{"t":"k","l":36,"k":"貯","h":"trữ","m":"tích trữ, để dành","n":"貝 (bối: tiền, của cải) + 宁 (trữ: cất giữ) — cất giữ của cải (tiền) lại → tích trữ. Mẹo: \"Cất tiền là trữ\"","ex":"貯金します","r":"chokin shimasu","em":"tiết kiệm tiền","x":""},{"t":"k","l":36,"k":"金","h":"kim","m":"vàng, tiền, kim loại","n":"Hình tượng trưng: hai thanh kim loại + hạt vàng bên dưới → vàng, tiền. Mẹo: \"Kim loại dưới đất là vàng\"","ex":"貯金します","r":"chokin shimasu","em":"tiết kiệm tiền","x":""},{"t":"k","l":36,"k":"過","h":"quá","m":"vượt qua, quá mức, trôi qua","n":"辶 (sước: đi) + 咼 (oa: méo mó) — đi qua chỗ méo mó (trắc trở) → vượt qua. Mẹo: \"Đi qua chỗ trắc trở là quá\"","ex":"過ぎます","r":"sugimasu","em":"vượt qua, trôi qua","x":""},{"t":"k","l":36,"k":"時","h":"thì","m":"thời gian, giờ","n":"日 (nhật: mặt trời) + 寺 (tự: chùa) — mặt trời ở chùa báo thời gian → thời khắc. Mẹo: \"Mặt trời ở chùa là thời gian\"","ex":"７時を～","r":"shichiji wo～","em":"7 giờ thì","x":""},{"t":"k","l":36,"k":"慣","h":"quán","m":"quen, thành thói quen","n":"忄 (tâm: trái tim, tâm lý) + 貫 (quán: xuyên qua) — tâm lý xuyên qua thành thói quen → quen thuộc. Mẹo: \"Tâm lý xuyên qua thành quen\"","ex":"慣れます","r":"naremasu","em":"quen, làm quen","x":""},{"t":"k","l":36,"k":"習","h":"tập","m":"tập luyện, tập quán","n":"羽 (vũ: lông chim) + 白 (bạch: trắng) — chim non tập bay với lông trắng → tập luyện, thói quen. Mẹo: \"Chim trắng tập bay là tập\"","ex":"習慣","r":"shūkan","em":"thói quen","x":""},{"t":"k","l":36,"k":"腐","h":"hủ","m":"thối rữa, hư hỏng","n":"府 (phủ: phủ đệ) + 肉 (nhục: thịt) — thịt trong phủ bị để lâu → thối rữa. Mẹo: \"Thịt để lâu trong phủ là hủ\"","ex":"腐ります","r":"kusarimasu","em":"bị thối, hư hỏng","x":""},{"t":"k","l":36,"k":"食","h":"thực","m":"ăn, thức ăn","n":"Hình cái miệng đang ăn cơm → ăn, thực phẩm. Mẹo: \"Miệng ăn là thực\"","ex":"食べ物","r":"tabemono","em":"đồ ăn (thực vật)","x":""},{"t":"k","l":36,"k":"物","h":"vật","m":"đồ vật, sự vật","n":"牛 (ngưu: con bò) + 勿 (vật: đừng) — thịt bò là đồ vật. Mẹo: \"Thịt bò là vật\"","ex":"食べ物","r":"tabemono","em":"đồ ăn","x":""},{"t":"k","l":36,"k":"剣","h":"kiếm","m":"kiếm, thanh gươm","n":"僉 (thiêm: cùng nhau) + 刂 (đao: dao) — nhiều người dùng dao → kiếm. Mẹo: \"Dao cùng nhau là kiếm\"","ex":"剣道","r":"kendō","em":"kiếm đạo","x":""},{"t":"k","l":36,"k":"道","h":"đạo","m":"đường, đạo lý","n":"首 (thủ: đầu) + 辶 (sước: đi) — hướng đầu đi là con đường mình theo → con đường, đạo lý. Mẹo: \"Đầu đi hướng nào là đạo\"","ex":"剣道","r":"kendō","em":"kiếm đạo","x":""},{"t":"k","l":36,"k":"柔","h":"nhu","m":"mềm mại, nhu nhuyễn","n":"矛 (mâu: giáo) + 木 (mộc: gỗ) — giáo bằng gỗ mềm dẻo → mềm. Mẹo: \"Giáo gỗ mềm là nhu\"","ex":"柔道","r":"jūdō","em":"nhu đạo (võ judo)","x":""},{"t":"k","l":36,"k":"宇","h":"vũ","m":"nhà, mái nhà, không gian","n":"宀 (miên: mái nhà) + 于 (vu: ở) — ở dưới mái nhà → không gian, vũ trụ. Mẹo: \"Mái nhà che không gian là vũ trụ\"","ex":"宇宙","r":"uchū","em":"vũ trụ","x":""},{"t":"k","l":36,"k":"宙","h":"trụ","m":"không gian, trời đất","n":"宀 (miên: mái nhà) + 由 (do: từ) — từ trong mái nhà ra không gian bao la → vũ trụ. Mẹo: \"Từ mái nhà ra trời là trụ\"","ex":"宇宙","r":"uchū","em":"vũ trụ","x":""},{"t":"k","l":36,"k":"曲","h":"khúc","m":"khúc, đoạn, uốn cong","n":"Hình cái đĩa bị uốn cong → khúc, khúc nhạc. Mẹo: \"Đĩa cong là khúc\"","ex":"曲","r":"kyoku","em":"khúc nhạc, bài hát","x":""},{"t":"k","l":36,"k":"毎","h":"mỗi","m":"mỗi, hàng","n":"人 (nhân: người) + 母 (mẫu: mẹ) — mỗi người đều có mẹ. Mẹo: \"Mỗi người có mẹ\"","ex":"毎週","r":"maishū","em":"mỗi tuần","x":""},{"t":"k","l":36,"k":"週","h":"chu","m":"tuần","n":"辶 (sước: đi) + 周 (chu: vòng tròn) — đi một vòng tròn hết một tuần. Mẹo: \"Đi vòng tròn là tuần\"","ex":"毎週","r":"maishū","em":"mỗi tuần","x":""},{"t":"k","l":36,"k":"月","h":"nguyệt","m":"tháng, mặt trăng","n":"Hình mặt trăng khuyết → mặt trăng, tháng. Mẹo: \"Trăng khuyết là nguyệt\"","ex":"毎月","r":"maitsuki","em":"mỗi tháng","x":""},{"t":"k","l":36,"k":"年","h":"niên","m":"năm","n":"Hình người gánh lúa → mùa màng, năm. Mẹo: \"Người gánh lúa là năm\"","ex":"毎年","r":"maitoshi / mainen","em":"mỗi năm","x":""},{"t":"k","l":36,"k":"必","h":"tất","m":"nhất định, ắt hẳn","n":"心 (tâm: tim) + 丿 (phiệt: nét xéo) — nét xéo xuyên qua tim → điều chắc chắn. Mẹo: \"Mũi tên xuyên tim là tất yếu\"","ex":"必ず","r":"kanarazu","em":"nhất định, ắt hẳn","x":""},{"t":"k","l":36,"k":"絶","h":"tuyệt","m":"tuyệt đối, dứt hẳn","n":"糸 (mịch: tơ) + 色 (sắc: màu) — tơ đứt hẳn, sắc màu biến mất → tuyệt. Mẹo: \"Tơ đứt sắc mất là tuyệt\"","ex":"絶対に","r":"zettai ni","em":"tuyệt đối","x":""},{"t":"k","l":36,"k":"対","h":"đối","m":"đối diện, trả lời","n":"寸 (thốn: gang tay) + 専 (chuyên: chuyên môn) — gang tay đối diện chuyên môn → đối đáp. Mẹo: \"Tay chuyên đối diện là đối\"","ex":"絶対に","r":"zettai ni","em":"tuyệt đối","x":""},{"t":"k","l":37,"k":"褒","h":"bao","m":"khen ngợi, tán dương","n":"衣 (y: quần áo) + 保 (bảo: giữ gìn) → giữ gìn quần áo sạch đẹp để được khen. Mẹo: \"Giữ áo sạch được khen bao\"","ex":"褒めます","r":"hometasu","em":"khen ngợi","x":""},{"t":"k","l":37,"k":"誘","h":"dụ","m":"rủ rê, mời, dụ dỗ","n":"言 (ngôn: lời nói) + 秀 (tú: xuất sắc, đẹp) → dùng lời đẹp, khéo léo để rủ rê → dụ dỗ. Mẹo: \"Lời đẹp rủ rê là dụ\"","ex":"誘います","r":"sasoimasu","em":"rủ rê, mời","x":""},{"t":"k","l":37,"k":"招","h":"chiêu","m":"mời gọi, triệu tập","n":"扌 (thủ: tay) + 召 (triệu: gọi) → dùng tay ra hiệu gọi người khác đến → mời. Mẹo: \"Tay gọi là chiêu mời\"","ex":"招待します","r":"shōtai shimasu","em":"mời, chiêu đãi","x":""},{"t":"k","l":37,"k":"待","h":"đãi","m":"đối đãi, tiếp đãi","n":"彳 (sách: bước chân) + 寺 (tự: chùa) → bước đến chùa để được tiếp đãi. Mẹo: \"Bước vào chùa là đãi\"","ex":"招待します","r":"shōtai shimasu","em":"chiêu đãi, tiếp đãi","x":""},{"t":"k","l":37,"k":"頼","h":"lại","m":"nhờ vả, cậy dựa","n":"束 (thúc: bó, cột) + 頁 (hiệt: đầu) → cột đầu (suy nghĩ) nhờ người khác → nhờ vả. Mẹo: \"Cột đầu nhờ người là lại\"","ex":"頼みます","r":"tanomimasu","em":"nhờ vả, yêu cầu","x":""},{"t":"k","l":37,"k":"注","h":"chú","m":"chú ý, rót, đổ","n":"氵 (thủy: nước) + 主 (chủ: chính) → đổ nước tập trung vào một chỗ → chú tâm. Mẹo: \"Đổ nước chính là chú ý\"","ex":"注意します","r":"chūi shimasu","em":"chú ý","x":""},{"t":"k","l":37,"k":"意","h":"ý","m":"ý nghĩ, suy nghĩ","n":"音 (âm: âm thanh) + 心 (tâm: tim) → âm thanh từ trái tim → ý nghĩ. Mẹo: \"Âm thanh từ tim là ý\"","ex":"注意します","r":"chūi shimasu","em":"chú ý","x":""},{"t":"k","l":37,"k":"踏","h":"đạp","m":"đạp, bước lên, dẫm lên","n":"足 (túc: chân) + 沓 (đạp: nhiều, xếp chồng) → chân xếp chồng lên nhau để bước lên → đạp. Mẹo: \"Chân xếp chồng là đạp\"","ex":"踏みます","r":"fumimasu","em":"bước lên, đạp lên","x":""},{"t":"k","l":37,"k":"壊","h":"hoại","m":"phá hủy, làm hỏng","n":"土 (thổ: đất) + 褱 (hoại: bọc, bên trong) → đất bị làm vỡ bên trong → hư hỏng. Mẹo: \"Đất vỡ là hoại\"","ex":"壊します","r":"kowashimasu","em":"phá hủy, làm vỡ","x":""},{"t":"k","l":37,"k":"汚","h":"ô","m":"bẩn, làm bẩn","n":"氵 (thủy: nước) + 亏 (khuê: méo mó, xấu) → nước bị méo mó (dơ) → ô nhiễm. Mẹo: \"Nước bị méo là ô\"","ex":"汚します","r":"yogoshimasu","em":"làm bẩn","x":""},{"t":"k","l":37,"k":"行","h":"hành","m":"tiến hành, thực hiện","n":"彳 (sách: bước) + 亍 (xúc: bước) → hai bước chân đi → hành động. Mẹo: \"Bước chân là hành\"","ex":"行います","r":"okonaimasu","em":"thực hiện, tiến hành","x":""},{"t":"k","l":37,"k":"輸","h":"thâu","m":"vận chuyển, xuất nhập","n":"車 (xa: xe) + 俞 (du: thuyền nan, vận chuyển) → xe vận chuyển hàng hóa → xuất nhập khẩu. Mẹo: \"Xe chở hàng là vận chuyển\"","ex":"輸出します","r":"yushutsu shimasu","em":"xuất khẩu","x":""},{"t":"k","l":37,"k":"出","h":"xuất","m":"ra ngoài, xuất","n":"Hình chân bước ra khỏi hang → đi ra ngoài. Mẹo: \"Chân ra hang là xuất\"","ex":"輸出します","r":"yushutsu shimasu","em":"xuất khẩu","x":""},{"t":"k","l":37,"k":"入","h":"nhập","m":"vào, nhập vào","n":"Hình lưỡi dao đâm vào trong → vào bên trong. Mẹo: \"Đâm vào là nhập\"","ex":"輸入します","r":"yunyū shimasu","em":"nhập khẩu","x":""},{"t":"k","l":37,"k":"翻","h":"phiên","m":"lật, dịch, xoay chuyển","n":"羽 (vũ: lông cánh) + 番 (phiên: thay phiên) → lông cánh lật xoay thay phiên → phiên dịch, lật sang ngôn ngữ khác. Mẹo: \"Lông cánh lật là phiên\"","ex":"翻訳します","r":"hon'yaku shimasu","em":"dịch thuật","x":""},{"t":"k","l":37,"k":"訳","h":"dịch","m":"giải thích, dịch nghĩa","n":"言 (ngôn: lời nói) + 尺 (xích: thước đo) → dùng thước đo lời nói để giải thích → dịch. Mẹo: \"Đo lời là dịch\"","ex":"翻訳します","r":"hon'yaku shimasu","em":"dịch thuật","x":""},{"t":"k","l":37,"k":"発","h":"phát","m":"phát minh, phát hiện","n":"癶 (bát: bước chân) + 弓 (cung: cung) → bước ra bắn cung → bắn ra, phát ra. Mẹo: \"Bước bắn cung là phát\"","ex":"発明します","r":"hatsumei shimasu","em":"phát minh","x":""},{"t":"k","l":37,"k":"明","h":"minh","m":"sáng, rõ ràng","n":"日 (nhật: mặt trời) + 月 (nguyệt: mặt trăng) → mặt trời + mặt trăng chiếu sáng → sáng rõ. Mẹo: \"Nhật nguyệt sáng là minh\"","ex":"発明します","r":"hatsumei shimasu","em":"phát minh","x":""},{"t":"k","l":37,"k":"見","h":"kiến","m":"thấy, nhìn thấy","n":"Hình người có con mắt to trên đầu → nhìn thấy. Mẹo: \"Mắt trên đầu là thấy\"","ex":"発見します","r":"hakken shimasu","em":"phát hiện","x":""},{"t":"k","l":37,"k":"米","h":"mễ","m":"gạo","n":"Hạt gạo (chữ tượng hình: 十 + 八 + 十) → gạo. Mẹo: \"Hạt gạo là mễ\"","ex":"米","r":"kome","em":"gạo","x":""},{"t":"k","l":37,"k":"麦","h":"mạch","m":"lúa mạch","n":"Hình bông lúa mạch có hạt rủ xuống → lúa mạch. Mẹo: \"Bông lúa rủ là mạch\"","ex":"麦","r":"mugi","em":"lúa mạch","x":""},{"t":"k","l":37,"k":"石","h":"thạch","m":"đá","n":"Hình mỏm đá dưới vách núi → đá. Mẹo: \"Vách núi mỏm đá là thạch\"","ex":"石油","r":"sekiyu","em":"dầu mỏ (đá + dầu)","x":""},{"t":"k","l":37,"k":"油","h":"du","m":"dầu, mỡ","n":"氵 (thủy: nước) + 由 (do: do, từ) → chất lỏng từ đất đá → dầu. Mẹo: \"Nước từ đất là dầu\"","ex":"石油","r":"sekiyu","em":"dầu mỏ","x":""},{"t":"k","l":37,"k":"原","h":"nguyên","m":"nguồn gốc, nguyên liệu","n":"厂 (hán: vách đá) + 泉 (tuyền: suối) → suối từ vách đá phun ra → nguyên, nguồn. Mẹo: \"Suối từ vách đá là nguồn\"","ex":"原料","r":"genryō","em":"nguyên liệu","x":""},{"t":"k","l":37,"k":"料","h":"liệu","m":"vật liệu, tiền công","n":"米 (mễ: gạo) + 斗 (đẩu: đấu) → đong gạo là tính tiền → vật liệu. Mẹo: \"Đong gạo là liệu\"","ex":"原料","r":"genryō","em":"nguyên liệu","x":""},{"t":"k","l":37,"k":"泥","h":"nê","m":"bùn, đất sét","n":"氵 (thủy: nước) + 尼 (ni: nhà sư, ni cô) → nước trộn đất thành bùn. Mẹo: \"Nước + đất = bùn\"","ex":"泥棒","r":"dorobō","em":"kẻ trộm (bùn + gậy)","x":""},{"t":"k","l":37,"k":"棒","h":"bổng","m":"gậy, dùi cui","n":"木 (mộc: gỗ) + 奉 (phụng: dâng, tôn kính) → cây gỗ để dùng → gậy. Mẹo: \"Gỗ dùng làm gậy là bổng\"","ex":"泥棒","r":"dorobō","em":"kẻ trộm","x":""},{"t":"k","l":37,"k":"警","h":"cảnh","m":"cảnh sát, cảnh báo","n":"敬 (kính: kính trọng) + 言 (ngôn: lời) → lời nói kính trọng để cảnh báo. Mẹo: \"Lời kính báo là cảnh\"","ex":"警官","r":"keikan","em":"cảnh sát","x":""},{"t":"k","l":37,"k":"官","h":"quan","m":"quan chức, công chức","n":"宀 (miên: nhà) + 㠯 (dĩ: vị trí) → người cai quản dưới mái nhà → quan. Mẹo: \"Trong nhà cai quản là quan\"","ex":"警官","r":"keikan","em":"cảnh sát","x":""},{"t":"k","l":37,"k":"世","h":"thế","m":"thế giới, đời","n":"Ba chục năm là một thế hệ → thế gian. Mẹo: \"Ba chục năm là thế\"","ex":"世界中","r":"sekaijū","em":"khắp thế giới","x":""},{"t":"k","l":37,"k":"界","h":"giới","m":"giới hạn, phạm vi","n":"田 (điền: ruộng) + 介 (giới: ranh giới) → ruộng có ranh giới → giới hạn. Mẹo: \"Ruộng có ranh là giới\"","ex":"世界中","r":"sekaijū","em":"khắp thế giới","x":""},{"t":"k","l":37,"k":"中","h":"trung","m":"ở giữa, trong, suốt","n":"Cây gậy cắm xuyên qua tâm vòng tròn → ở giữa. Mẹo: \"Cắm xuyên tâm là trung\"","ex":"世界中","r":"sekaijū","em":"khắp thế giới (trong/suốt thế giới)","x":""},{"t":"k","l":37,"k":"世","h":"thế","m":"thế kỷ (thế hệ)","n":"Như trên","ex":"世紀","r":"seiki","em":"thế kỷ","x":""},{"t":"k","l":37,"k":"紀","h":"kỷ","m":"kỷ nguyên, ghi chép","n":"糸 (mịch: tơ) + 己 (kỷ: mình) → sợi tơ ghi dấu mình → kỷ niệm, kỷ nguyên. Mẹo: \"Tơ ghi mình là kỷ\"","ex":"世紀","r":"seiki","em":"thế kỷ","x":""},{"t":"k","l":37,"k":"何","h":"hà","m":"gì, nào, sao","n":"亻 (nhân: người) + 可 (khả: có thể) → người có thể hỏi \"gì\". Mẹo: \"Người hỏi 'gì' là hà\"","ex":"何語","r":"nanigo","em":"ngôn ngữ gì","x":""},{"t":"k","l":37,"k":"語","h":"ngữ","m":"ngôn ngữ, lời nói","n":"言 (ngôn: lời) + 吾 (ngô: ta, tôi) → lời của tôi nói → ngôn ngữ. Mẹo: \"Lời ta nói là ngữ\"","ex":"何語","r":"nanigo","em":"ngôn ngữ gì","x":""},{"t":"k","l":37,"k":"東","h":"đông","m":"hướng đông","n":"木 (mộc: cây) + 日 (nhật: mặt trời) → mặt trời mọc sau cây → đông. Mẹo: \"Cây đón mặt trời mọc là đông\"","ex":"東大寺","r":"Tōdaiji","em":"chùa Đông Đại","x":""},{"t":"k","l":37,"k":"大","h":"đại","m":"lớn","n":"Hình người giang tay chỉ kích thước to lớn → lớn. Mẹo: \"Người giang tay là lớn\"","ex":"東大寺","r":"Tōdaiji","em":"chùa Đông Đại","x":""},{"t":"k","l":37,"k":"寺","h":"tự","m":"chùa","n":"土 (thổ: đất) + 寸 (thốn: gang tay) → đo đất để xây chùa → chùa. Mẹo: \"Đo đất xây chùa là tự\"","ex":"東大寺","r":"Tōdaiji","em":"chùa Đông Đại","x":""},{"t":"k","l":37,"k":"仏","h":"phật","m":"Phật, Đức Phật","n":"亻 (nhân: người) + 弗 (phất: không) → người không còn dục vọng → Phật. Mẹo: \"Người không dục là Phật\"","ex":"大仏","r":"Daibutsu","em":"tượng Phật lớn","x":""},{"t":"k","l":37,"k":"江","h":"giang","m":"sông, giang","n":"氵 (thủy: nước) + 工 (công: làm) → nước chảy theo công trình → sông. Mẹo: \"Nước làm thành sông là giang\"","ex":"江戸時代","r":"Edo jidai","em":"thời kỳ Edo (Giang Hộ)","x":""},{"t":"k","l":37,"k":"戸","h":"hộ","m":"cửa, nhà","n":"Hình cánh cửa bằng gỗ → cửa. Mẹo: \"Cánh cửa là hộ\"","ex":"江戸時代","r":"Edo jidai","em":"thời kỳ Edo","x":""},{"t":"k","l":37,"k":"時","h":"thời","m":"thời gian, thời đại","n":"日 (nhật: mặt trời) + 寺 (tự: chùa) → mặt trời ở chùa báo giờ → thời gian. Mẹo: \"Mặt trời ở chùa là thời\"","ex":"江戸時代","r":"Edo jidai","em":"thời kỳ Edo","x":""},{"t":"k","l":37,"k":"代","h":"đại","m":"thời đại, thay thế","n":"亻 (nhân: người) + 弋 (dặc: cái ghim) → người thay ghim (của cũ) → thay thế, thời đại. Mẹo: \"Người thay ghim là đại\"","ex":"江戸時代","r":"Edo jidai","em":"thời kỳ Edo","x":""},{"t":"k","l":38,"k":"参","h":"tham","m":"tham gia, dự vào","n":"厶 (khư: riêng tư) + 大 (đại: lớn) + 彡 (sam: ba) → ba người cùng tham gia một việc lớn. Mẹo: \"Ba người lớn tham gia\"","ex":"参加します","r":"sanka shimasu","em":"tham gia","x":""},{"t":"k","l":38,"k":"加","h":"gia","m":"thêm vào, gia nhập","n":"力 (lực: sức) + 口 (khẩu: miệng) → thêm sức, thêm tiếng nói vào → gia nhập, thêm vào. Mẹo: \"Thêm sức, thêm lời là gia\"","ex":"参加します","r":"sanka shimasu","em":"tham gia","x":""},{"t":"k","l":38,"k":"旅","h":"lữ","m":"du lịch, đoàn lữ hành","n":"方 (phương: phương hướng) + 氏 (thị: họ, người) → người đi theo phương hướng → lữ hành. Mẹo: \"Người đi phương hướng là lữ\"","ex":"旅行","r":"ryokō","em":"du lịch","x":""},{"t":"k","l":38,"k":"行","h":"hành","m":"đi, hành động","n":"彳 (sách: bước) + 亍 (xúc: bước) → hai bước chân → hành động, đi. Mẹo: \"Hai chân bước là hành\"","ex":"旅行","r":"ryokō","em":"du lịch","x":""},{"t":"k","l":38,"k":"育","h":"dục","m":"nuôi dưỡng, giáo dục","n":"亠 (đầu) + 云 (vân: nói) + 月 (nguyệt: thịt) → nói về việc nuôi dưỡng cơ thể → giáo dục. Mẹo: \"Nuôi dưỡng cơ thể là dục\"","ex":"育てます","r":"sodatemasu","em":"nuôi dưỡng, lớn lên","x":""},{"t":"k","l":38,"k":"運","h":"vận","m":"vận chuyển","n":"辶 (sước: đi) + 軍 (quân: quân đội) → quân đội di chuyển → vận chuyển. Mẹo: \"Quân đội di chuyển là vận\"","ex":"運びます","r":"hakobimasu","em":"vận chuyển, mang đi","x":""},{"t":"k","l":38,"k":"院","h":"viện","m":"viện, tòa nhà, cơ sở","n":"阝 (phụ: núi) + 完 (hoàn: hoàn thành) → nơi hoàn thành trên núi → viện, bệnh viện. Mẹo: \"Núi hoàn thành là viện\"","ex":"入院します","r":"nyūin shimasu","em":"nhập viện","x":""},{"t":"k","l":38,"k":"退","h":"thoái","m":"lùi lại, rút lui","n":"辶 (sước: đi) + 艮 (cấn: dừng) → dừng lại và lùi bước → thoái lui. Mẹo: \"Dừng bước lùi là thoái\"","ex":"退院します","r":"taiin shimasu","em":"xuất viện","x":""},{"t":"k","l":38,"k":"電","h":"điện","m":"điện","n":"雨 (vũ: mưa) + 申 (thân: sấm sét) → sấm sét từ mưa → điện. Mẹo: \"Sấm sét trong mưa là điện\"","ex":"電源","r":"dengen","em":"nguồn điện","x":""},{"t":"k","l":38,"k":"源","h":"nguyên","m":"nguồn, cội nguồn","n":"氵 (thủy: nước) + 原 (nguyên: nguồn) → nước từ nguồn chảy ra → cội nguồn. Mẹo: \"Nước từ nguyên là nguồn\"","ex":"電源","r":"dengen","em":"nguồn điện","x":""},{"t":"k","l":38,"k":"切","h":"thiết","m":"cắt, ngắt","n":"七 (thất: bảy) + 刀 (đao: dao) → dao cắt thành bảy → cắt. Mẹo: \"Dao cắt bảy là thiết\"","ex":"切ります","r":"kirimasu","em":"cắt, ngắt (nguồn điện)","x":""},{"t":"k","l":38,"k":"掛","h":"quải","m":"treo, móc, gọi điện","n":"扌 (thủ: tay) + 卦 (quái: quẻ bói) → tay bấm quẻ, tay làm thao tác treo/móc → treo, gọi (điện thoại). Mẹo: \"Tay bấm treo là quải\"","ex":"掛けます","r":"kakemasu","em":"treo, móc, gọi (điện)","x":""},{"t":"k","l":38,"k":"気","h":"khí","m":"khí, hơi, tâm trạng","n":"气 (khí: hơi) + 米 (mễ: gạo) → hơi từ gạo (nấu cơm) → khí, tinh thần. Mẹo: \"Hơi gạo là khí\"","ex":"気持ち","r":"kimochi","em":"cảm giác, tâm trạng","x":""},{"t":"k","l":38,"k":"持","h":"trì","m":"cầm, giữ","n":"扌 (thủ: tay) + 寺 (tự: chùa) → tay cầm ở chùa → nắm giữ. Mẹo: \"Tay cầm ở chùa là trì\"","ex":"気持ち","r":"kimochi","em":"cảm giác (khí trì)","x":""},{"t":"k","l":38,"k":"悪","h":"ác","m":"xấu, dở, ác","n":"亞 (á: xấu) + 心 (tâm: tim) → tâm xấu → ác. Mẹo: \"Tâm xấu là ác\"","ex":"気持ちが悪い","r":"kimochi ga warui","em":"cảm thấy khó chịu (xấu)","x":""},{"t":"k","l":38,"k":"大","h":"đại","m":"lớn","n":"Người giang tay → to lớn. Mẹo: \"Giang tay là đại\"","ex":"大きな","r":"ōkina","em":"to lớn","x":""},{"t":"k","l":38,"k":"小","h":"tiểu","m":"nhỏ","n":"Ba nét chấm nhỏ → nhỏ. Mẹo: \"Ba chấm nhỏ là tiểu\"","ex":"小さな","r":"chiisana","em":"nhỏ","x":""},{"t":"k","l":38,"k":"赤","h":"xích","m":"màu đỏ","n":"大 (đại: lớn) + 火 (hỏa: lửa) → lửa lớn có màu đỏ → đỏ. Mẹo: \"Lửa lớn là đỏ\"","ex":"赤ちゃん","r":"akachan","em":"em bé (đỏ hỏn)","x":""},{"t":"k","l":38,"k":"学","h":"học","m":"học, trường học","n":"Hình đứa trẻ học trong nhà → học. Mẹo: \"Trẻ học là học\"","ex":"小学校","r":"shōgakkō","em":"trường tiểu học","x":""},{"t":"k","l":38,"k":"校","h":"hiệu","m":"trường học","n":"木 (mộc: gỗ) + 交 (giao: giao nhau) → cọc gỗ đánh dấu trường → trường học. Mẹo: \"Cọc gỗ giao là hiệu\"","ex":"小学校","r":"shōgakkō","em":"trường tiểu học","x":""},{"t":"k","l":38,"k":"中","h":"trung","m":"giữa, trung","n":"Cây gậy cắm xuyên tâm vòng tròn → ở giữa. Mẹo: \"Cắm xuyên tâm là trung\"","ex":"中学校","r":"chūgakkō","em":"trường trung học","x":""},{"t":"k","l":38,"k":"駅","h":"dịch","m":"nhà ga","n":"馬 (mã: ngựa) + 尺 (xích: thước) → trạm ngựa, nơi đo đạc đường đi → ga tàu. Mẹo: \"Ngựa + thước là ga\"","ex":"駅前","r":"ekimae","em":"trước ga","x":""},{"t":"k","l":38,"k":"前","h":"tiền","m":"phía trước","n":"刂 (đao: dao) + 月 (nguyệt: thịt) + 舟 (chu: thuyền) → dao chỉ phía trước thuyền → đằng trước. Mẹo: \"Dao chỉ trước thuyền là tiền\"","ex":"駅前","r":"ekimae","em":"trước ga","x":""},{"t":"k","l":38,"k":"海","h":"hải","m":"biển","n":"氵 (thủy: nước) + 毎 (mỗi: mỗi) → mỗi nơi đều có nước là biển. Mẹo: \"Mỗi nước là biển\"","ex":"海岸","r":"kaigan","em":"bờ biển","x":""},{"t":"k","l":38,"k":"岸","h":"ngạn","m":"bờ","n":"山 (sơn: núi) + 厂 (hán: vách đá) → núi vách đá ven biển → bờ. Mẹo: \"Núi ven biển là bờ\"","ex":"海岸","r":"kaigan","em":"bờ biển","x":""},{"t":"k","l":38,"k":"工","h":"công","m":"công, xưởng","n":"Hình cái thước thợ → công nhân, công việc. Mẹo: \"Thước thợ là công\"","ex":"工場","r":"kōjō","em":"nhà máy, công xưởng","x":""},{"t":"k","l":38,"k":"場","h":"trường","m":"nơi, chỗ, bãi","n":"土 (thổ: đất) + 昜 (dương: mặt trời) → bãi đất có ánh sáng → nơi. Mẹo: \"Đất có nắng là trường\"","ex":"工場","r":"kōjō","em":"nhà máy","x":""},{"t":"k","l":38,"k":"村","h":"thôn","m":"làng, thôn","n":"木 (mộc: cây) + 寸 (thốn: gang tay) → cây đo đạc làng → thôn. Mẹo: \"Cây đo làng là thôn\"","ex":"村","r":"mura","em":"làng","x":""},{"t":"k","l":38,"k":"指","h":"chỉ","m":"ngón tay, chỉ","n":"扌 (thủ: tay) + 旨 (chỉ: chỉ dẫn) → tay chỉ dẫn → ngón tay. Mẹo: \"Tay chỉ dẫn là chỉ\"","ex":"指輪","r":"yubiwa","em":"nhẫn (ngón tay + bánh xe)","x":""},{"t":"k","l":38,"k":"輪","h":"luân","m":"bánh xe, vòng tròn","n":"車 (xa: xe) + 侖 (luân: luân lý) → xe có bánh tròn → bánh xe, vòng tròn. Mẹo: \"Xe có vòng là luân\"","ex":"指輪","r":"yubiwa","em":"nhẫn (vòng cho ngón tay)","x":""},{"t":"k","l":38,"k":"健","h":"kiện","m":"khỏe mạnh","n":"亻 (nhân: người) + 建 (kiến: xây dựng) → người xây dựng sức khỏe → khỏe. Mẹo: \"Người xây sức là kiện\"","ex":"健康","r":"kenkō","em":"sức khỏe","x":""},{"t":"k","l":38,"k":"康","h":"khang","m":"an lành, khỏe mạnh","n":"广 (nghiễm: mái nhà) + 隶 (lệ: người) → người trong nhà an khang → khang. Mẹo: \"Người trong nhà an là khang\"","ex":"健康","r":"kenkō","em":"sức khỏe","x":""},{"t":"k","l":38,"k":"製","h":"chế","m":"chế tạo, sản xuất","n":"衣 (y: áo) + 制 (chế: quy định) → may áo theo quy định → chế tạo. Mẹo: \"May áo theo lệ là chế\"","ex":"～製","r":"～sei","em":"sản phẩm, chế tạo (ví dụ: 日本製 - sản xuất Nhật)","x":""},{"t":"k","l":39,"k":"答","h":"đáp","m":"trả lời","n":"竹 (trúc: tre) + 合 (hợp: gộp lại) → gộp các thanh tre lại thành một cặp (trúc thư) để viết câu trả lời. Mẹo: \"Tre gộp lại là câu trả lời\"","ex":"答えます","r":"kotaemasu","em":"trả lời","x":""},{"t":"k","l":39,"k":"質","h":"chất","m":"chất lượng, nội dung, bản chất","n":"斤 (cân: rìu) + 貝 (bối: tiền, của cải) + 斦 (đãn: cái đe) → dùng rìu kiểm tra của cải trên đe để xem chất lượng. Mẹo: \"Kiểm tra của cải để biết chất lượng\"","ex":"質問","r":"shitsumon","em":"câu hỏi (chất vấn)","x":""},{"t":"k","l":39,"k":"問","h":"vấn","m":"hỏi, vấn đề","n":"門 (môn: cửa) + 口 (khẩu: miệng) → miệng hỏi ở cửa → hỏi. Mẹo: \"Miệng ở cửa hỏi là vấn\"","ex":"質問","r":"shitsumon","em":"câu hỏi (chất vấn)","x":""},{"t":"k","l":39,"k":"倒","h":"đảo","m":"đổ, ngã","n":"亻 (nhân: người) + 到 (đáo: đến) → người đến rồi ngã xuống → đổ, ngã. Mẹo: \"Người đến ngã là đảo\"","ex":"倒れます","r":"taoremasu","em":"ngã, đổ","x":""},{"t":"k","l":39,"k":"通","h":"thông","m":"đi qua, thông suốt, thông thường","n":"辶 (sước: đi) + 甬 (dũng: đường hầm) → đi qua đường hầm → thông suốt. Mẹo: \"Đi qua hầm là thông\"","ex":"通ります","r":"tōrimasu","em":"đi qua, chạy qua","x":""},{"t":"k","l":39,"k":"死","h":"tử","m":"chết","n":"Hình người đang quỳ trước bộ xương → tử vong, chết. Mẹo: \"Người quỳ trước xương là chết\"","ex":"死にます","r":"shinimasu","em":"chết","x":""},{"t":"k","l":39,"k":"安","h":"an","m":"yên ổn, an toàn","n":"宀 (miên: mái nhà) + 女 (nữ: đàn bà) → người phụ nữ ở trong nhà → bình an. Mẹo: \"Đàn bà trong nhà là an\"","ex":"安心します","r":"anshin shimasu","em":"yên tâm","x":""},{"t":"k","l":39,"k":"心","h":"tâm","m":"trái tim, tâm hồn","n":"Hình trái tim (quả tim) → tâm. Mẹo: \"Hình trái tim là tâm\"","ex":"安心します","r":"anshin shimasu","em":"yên tâm","x":""},{"t":"k","l":39,"k":"離","h":"ly","m":"xa cách, rời xa","n":"隹 (chuy: chim) + 离 (li: rời) → chim rời xa tổ → ly hôn. Mẹo: \"Chim rời tổ là ly\"","ex":"離婚します","r":"rikon shimasu","em":"ly hôn","x":""},{"t":"k","l":39,"k":"婚","h":"hôn","m":"hôn nhân, kết hôn","n":"女 (nữ: phụ nữ) + 昏 (hôn: hoàng hôn) → người phụ nữ kết hôn vào lúc hoàng hôn. Mẹo: \"Phụ nữ hoàng hôn là hôn nhân\"","ex":"離婚します","r":"rikon shimasu","em":"ly hôn","x":""},{"t":"k","l":39,"k":"太","h":"thái","m":"béo, to","n":"大 (đại: lớn) + 丶 (chấm: nhấn mạnh) → lớn hơn bình thường → béo. Mẹo: \"Lớn thêm chấm là béo\"","ex":"太ります","r":"futorimasu","em":"béo lên","x":""},{"t":"k","l":39,"k":"複","h":"phức","m":"phức tạp, nhiều lớp","n":"衣 (y: áo) + 复 (phục: trở lại) → nhiều lớp áo → phức tạp. Mẹo: \"Nhiều lớp áo là phức\"","ex":"複雑[な]","r":"fukuzatsu [na]","em":"phức tạp","x":""},{"t":"k","l":39,"k":"雑","h":"tạp","m":"tạp, hỗn tạp","n":"隹 (chuy: chim) + 衣 (y: áo) → lông chim áo lẫn lộn → tạp. Mẹo: \"Chim áo lẫn lộn là tạp\"","ex":"複雑[な]","r":"fukuzatsu [na]","em":"phức tạp","x":""},{"t":"k","l":39,"k":"邪","h":"tà","m":"tà, xấu, ma quái","n":"牙 (nha: răng nanh) + 阝 (phụ: núi) → răng nanh ở núi → tà. Mẹo: \"Răng nanh ở núi là tà\"","ex":"邪魔[な]","r":"jama [na]","em":"cản trở, quấy rầy (tà ma)","x":""},{"t":"k","l":39,"k":"魔","h":"ma","m":"ma quỷ, ma thuật","n":"麻 (ma: cây gai) + 鬼 (quỷ: ma quỷ) → ma quỷ ở cây gai → ma. Mẹo: \"Ma ở cây gai là ma\"","ex":"邪魔[な]","r":"jama [na]","em":"cản trở (tà ma)","x":""},{"t":"k","l":39,"k":"硬","h":"ngạnh","m":"cứng","n":"石 (thạch: đá) + 更 (canh: thay đổi) → đá thay đổi thành cứng → cứng. Mẹo: \"Đá thay đổi là cứng\"","ex":"硬い","r":"katai","em":"cứng","x":""},{"t":"k","l":39,"k":"軟","h":"nhuyễn","m":"mềm","n":"車 (xa: xe) + 欠 (khiếm: thiếu) → xe thiếu sức nặng → mềm. Mẹo: \"Xe thiếu nặng là mềm\"","ex":"軟らかい","r":"yawarakai","em":"mềm, mềm mại","x":""},{"t":"k","l":39,"k":"汚","h":"ô","m":"bẩn","n":"氵 (thủy: nước) + 亏 (khuê: méo mó, xấu) → nước méo mó → bẩn. Mẹo: \"Nước méo là ô\"","ex":"汚い","r":"kitanai","em":"bẩn","x":""},{"t":"k","l":39,"k":"悲","h":"bi","m":"buồn, bi thương","n":"非 (phi: sai trái) + 心 (tâm: tim) → tâm sai trái → buồn. Mẹo: \"Tâm sai là bi\"","ex":"悲しい","r":"kanashii","em":"buồn, đáng thương","x":""},{"t":"k","l":39,"k":"恥","h":"sỉ","m":"xấu hổ, nhục nhã","n":"耳 (nhĩ: tai) + 心 (tâm: tim) → tai nghe, tim nhục → xấu hổ. Mẹo: \"Tai nghe tim nhục là sỉ\"","ex":"恥ずかしい","r":"hazukashii","em":"xấu hổ","x":""},{"t":"k","l":39,"k":"首","h":"thủ","m":"đầu, thủ tướng","n":"Hình cái đầu có tóc → đầu, thủ lĩnh. Mẹo: \"Cái đầu là thủ\"","ex":"首相","r":"shushō","em":"thủ tướng","x":""},{"t":"k","l":39,"k":"相","h":"tướng","m":"tướng, tương hỗ","n":"木 (mộc: cây) + 目 (mục: mắt) → cây có mắt → tướng. Mẹo: \"Cây có mắt là tướng\"","ex":"首相","r":"shushō","em":"thủ tướng","x":""},{"t":"k","l":39,"k":"地","h":"địa","m":"đất, mặt đất","n":"土 (thổ: đất) + 也 (dã: vậy) → đất vậy → địa. Mẹo: \"Đất là địa\"","ex":"地震","r":"jishin","em":"động đất","x":""},{"t":"k","l":39,"k":"震","h":"chấn","m":"chấn động, rung động","n":"雨 (vũ: mưa) + 辰 (thần: rồng) → rồng (thần) dưới đất rung → chấn động. Mẹo: \"Rồng rung là chấn\"","ex":"地震","r":"jishin","em":"động đất","x":""},{"t":"k","l":39,"k":"津","h":"tân","m":"bến nước, sóng thần","n":"氵 (thủy: nước) + 聿 (duật: cây bút) → nước với bút vẽ sóng → sóng thần. Mẹo: \"Nước với bút là sóng\"","ex":"津波","r":"tsunami","em":"sóng thần","x":""},{"t":"k","l":39,"k":"波","h":"ba","m":"sóng nước","n":"氵 (thủy: nước) + 皮 (bì: da) → làn sóng như da nước → sóng. Mẹo: \"Da nước là sóng\"","ex":"津波","r":"tsunami","em":"sóng thần","x":""},{"t":"k","l":39,"k":"台","h":"đài","m":"bục, đài, cơn bão","n":"厶 (khư: riêng) + 口 (khẩu: miệng) → miệng nói riêng từ đài → đài, bục. Mẹo: \"Miệng ở đài là đài\"","ex":"台風","r":"taifū","em":"bão (đài phong)","x":""},{"t":"k","l":39,"k":"風","h":"phong","m":"gió","n":"凡 (phàm: phàm) + 虫 (trùng: sâu bọ) → sâu bọ bay trong gió. Mẹo: \"Sâu bay là có gió\"","ex":"台風","r":"taifū","em":"bão (đài phong)","x":""},{"t":"k","l":39,"k":"雷","h":"lôi","m":"sấm sét","n":"雨 (vũ: mưa) + 田 (điền: ruộng) → sấm sét trên ruộng → lôi. Mẹo: \"Mưa trên ruộng là sấm\"","ex":"雷","r":"kaminari","em":"sấm sét","x":""},{"t":"k","l":39,"k":"火","h":"hỏa","m":"lửa","n":"Hình ngọn lửa đang cháy → lửa. Mẹo: \"Ngọn lửa là hỏa\"","ex":"火事","r":"kaji","em":"đám cháy (hỏa sự)","x":""},{"t":"k","l":39,"k":"事","h":"sự","m":"việc, sự kiện","n":"亠 (đầu) + 口 (khẩu: miệng) + 亅 (quyết: móc) → ghi chép việc → sự. Mẹo: \"Ghi chép việc là sự\"","ex":"火事","r":"kaji","em":"đám cháy","x":""},{"t":"k","l":39,"k":"故","h":"cố","m":"nguyên nhân, việc cũ","n":"古 (cổ: cũ) + 攵 (phộc: tác động) → tác động vào cái cũ tìm nguyên nhân. Mẹo: \"Tác động vào cũ là nguyên nhân\"","ex":"事故","r":"jiko","em":"tai nạn, sự cố","x":""},{"t":"k","l":39,"k":"合","h":"hợp","m":"hòa hợp, gặp gỡ","n":"亼 (tập: họp) + 口 (khẩu: miệng) → nhiều miệng họp nói chung. Mẹo: \"Miệng họp nói chung là hợp\"","ex":"見合い","r":"miai","em":"xem mắt, hứa hôn","x":""},{"t":"k","l":39,"k":"作","h":"tác","m":"tác phẩm, tạo tác","n":"亻 (nhân: người) + 乍 (sạ: làm) → người làm ra tác phẩm. Mẹo: \"Người làm là tác\"","ex":"操作","r":"sōsa","em":"thao tác","x":""},{"t":"k","l":39,"k":"操","h":"thao","m":"thao tác, điều khiển","n":"扌 (thủ: tay) + 喿 (tháo: ồn ào) → tay điều khiển giữa sự ồn ào. Mẹo: \"Tay điều khiển là thao\"","ex":"操作","r":"sōsa","em":"thao tác","x":""},{"t":"k","l":39,"k":"場","h":"trường","m":"nơi, chỗ, hội trường","n":"土 (thổ: đất) + 昜 (dương: mặt trời) → bãi đất có ánh sáng → trường. Mẹo: \"Đất có nắng là trường\"","ex":"会場","r":"kaijō","em":"hội trường","x":""},{"t":"k","l":39,"k":"代","h":"đại","m":"thời đại, giá cả","n":"亻 (nhân: người) + 弋 (dặc: cái ghim) → người thay ghim → thay thế, thời đại. Mẹo: \"Người thay ghim là đại\"","ex":"～代","r":"～dai","em":"giá cả, thời đại (ví dụ: 1代 - giá 1 đời)","x":""},{"t":"k","l":39,"k":"屋","h":"ốc","m":"nhà, cửa hàng","n":"尸 (thi: xác) + 至 (chí: đến) → người đến mái nhà → ốc. Mẹo: \"Người đến nhà là ốc\"","ex":"～屋","r":"～ya","em":"cửa hàng, nhà (ví dụ: 本屋 - nhà sách)","x":""},{"t":"k","l":39,"k":"号","h":"hiệu","m":"số hiệu, tên hiệu","n":"口 (khẩu: miệng) + 丂 (khảo: thổi) → miệng thổi ra số hiệu. Mẹo: \"Miệng thổi số là hiệu\"","ex":"号室","r":"gōshitsu","em":"phòng số (ví dụ: 101号室 - phòng 101)","x":""},{"t":"k","l":39,"k":"室","h":"thất","m":"phòng","n":"宀 (miên: nhà) + 至 (chí: đến) → đến nhà vào phòng → thất. Mẹo: \"Đến nhà vào phòng là thất\"","ex":"号室","r":"gōshitsu","em":"phòng số","x":""},{"t":"k","l":39,"k":"勢","h":"thế","m":"sức mạnh, thế lực","n":"力 (lực: sức) + 執 (chấp: cầm nắm) → nắm giữ sức mạnh → thế. Mẹo: \"Nắm giữ sức là thế\"","ex":"大勢","r":"ōzei","em":"đông người (đại thế)","x":""},{"t":"k","l":40,"k":"数","h":"số","m":"đếm, số lượng","n":"米 (mễ: gạo) + 攵 (phộc: đánh, gõ) + 女 (nữ: đàn bà) → gõ hạt gạo đếm số lượng. Mẹo: \"Gõ gạo đếm số\"","ex":"数えます","r":"kazoemasu","em":"đếm","x":""},{"t":"k","l":40,"k":"測","h":"trắc","m":"đo lường","n":"氵 (thủy: nước) + 則 (tắc: nguyên tắc, thước) → dùng thước đo nước → đo lường. Mẹo: \"Thước đo nước là trắc\"","ex":"測ります","r":"hakarimasu","em":"đo (chiều dài, diện tích)","x":""},{"t":"k","l":40,"k":"量","h":"lượng","m":"số lượng, đo lường","n":"日 (nhật: mặt trời) + 里 (lý: dặm) → dặm dưới ánh mặt trời → đo đạc, số lượng. Mẹo: \"Dặm dưới mặt trời là lượng\"","ex":"量ります","r":"hakarimasu","em":"cân, đo lường","x":""},{"t":"k","l":40,"k":"確","h":"xác","m":"chắc chắn, xác thực","n":"石 (thạch: đá) + 角 (giác: sừng) + 隹 (chuy: chim) → chim đứng trên đá chắc chắn. Mẹo: \"Chim trên đá là xác thực\"","ex":"確かめます","r":"tashikamemasu","em":"xác nhận, kiểm tra","x":""},{"t":"k","l":40,"k":"合","h":"hợp","m":"khớp, vừa, phù hợp","n":"亼 (tập: họp) + 口 (khẩu: miệng) → nhiều miệng họp nói chung một điều. Mẹo: \"Miệng họp nói chung là hợp\"","ex":"合います","r":"aimasu","em":"vừa vặn, khớp","x":""},{"t":"k","l":40,"k":"出","h":"xuất","m":"ra, xuất hiện","n":"Hình chân bước ra khỏi hang → đi ra ngoài. Mẹo: \"Chân ra hang là xuất\"","ex":"出発します","r":"shuppatsu shimasu","em":"xuất phát","x":""},{"t":"k","l":40,"k":"発","h":"phát","m":"phát động, xuất phát","n":"癶 (bát: bước chân) + 弓 (cung: cung) → bước ra bắn cung → phát động. Mẹo: \"Bước bắn cung là phát\"","ex":"出発します","r":"shuppatsu shimasu","em":"xuất phát","x":""},{"t":"k","l":40,"k":"到","h":"đáo","m":"đến","n":"至 (chí: đến) + 刂 (đao: dao) → dao chỉ nơi đến. Mẹo: \"Dao chỉ đến là đáo\"","ex":"到着します","r":"tōchaku shimasu","em":"đến nơi","x":""},{"t":"k","l":40,"k":"着","h":"trước","m":"đến, mặc, chạm","n":"羊 (dương: dê) + 目 (mục: mắt) → mắt dê nhìn thấy nơi đến. Mẹo: \"Dê thấy nơi đến là trước\"","ex":"到着します","r":"tōchaku shimasu","em":"đến nơi","x":""},{"t":"k","l":40,"k":"酔","h":"túy","m":"say","n":"酉 (dậu: rượu) + 卒 (tốt: lính) → uống rượu như lính → say. Mẹo: \"Rượu lính say là túy\"","ex":"酔います","r":"yoimasu","em":"say (rượu, xe)","x":""},{"t":"k","l":40,"k":"問","h":"vấn","m":"hỏi, vấn đề","n":"門 (môn: cửa) + 口 (khẩu: miệng) → miệng hỏi ở cửa. Mẹo: \"Miệng ở cửa hỏi là vấn\"","ex":"問題","r":"mondai","em":"vấn đề","x":""},{"t":"k","l":40,"k":"題","h":"đề","m":"đề tài, vấn đề","n":"是 (thị: đúng) + 頁 (hiệt: đầu) → cái đầu đúng là đề mục. Mẹo: \"Đầu đúng là đề\"","ex":"問題","r":"mondai","em":"vấn đề","x":""},{"t":"k","l":40,"k":"相","h":"tương","m":"nhau, cùng","n":"木 (mộc: cây) + 目 (mục: mắt) → cây và mắt cùng nhau → tương hỗ. Mẹo: \"Cây mắt cùng nhau là tương\"","ex":"相談します","r":"sōdan shimasu","em":"tham khảo, bàn bạc","x":""},{"t":"k","l":40,"k":"談","h":"đàm","m":"nói chuyện, đàm đạo","n":"言 (ngôn: lời) + 炎 (diêm: lửa) → lời như lửa nóng → đàm đạo. Mẹo: \"Lời như lửa là đàm\"","ex":"相談します","r":"sōdan shimasu","em":"tham khảo, bàn bạc","x":""},{"t":"k","l":40,"k":"必","h":"tất","m":"nhất định, ắt","n":"心 (tâm: tim) + 丿 (phiệt: nét xéo) → nét xéo xuyên tim → điều chắc chắn. Mẹo: \"Xuyên tim là tất yếu\"","ex":"必要[な]","r":"hitsuyō [na]","em":"cần thiết","x":""},{"t":"k","l":40,"k":"要","h":"yếu","m":"quan trọng, cần thiết","n":"西 (tây: hướng tây) + 女 (nữ: đàn bà) → đàn bà ở phương tây cần thiết. Mẹo: \"Phụ nữ cần là yếu\"","ex":"必要[な]","r":"hitsuyō [na]","em":"cần thiết","x":""},{"t":"k","l":40,"k":"天","h":"thiên","m":"trời","n":"Hình người có đầu là trời → trời. Mẹo: \"Đầu trời là thiên\"","ex":"天気","r":"tenki","em":"thời tiết (thiên khí)","x":""},{"t":"k","l":40,"k":"気","h":"khí","m":"hơi, khí, tinh thần","n":"气 (khí: hơi) + 米 (mễ: gạo) → hơi gạo → khí. Mẹo: \"Hơi gạo là khí\"","ex":"天気","r":"tenki","em":"thời tiết","x":""},{"t":"k","l":40,"k":"予","h":"dự","m":"trước, dự báo","n":"予 (dư: tôi) → tôi nói trước → dự báo. Mẹo: \"Tôi nói trước là dự\"","ex":"予報","r":"yohō","em":"dự báo","x":""},{"t":"k","l":40,"k":"報","h":"báo","m":"báo tin, thông báo","n":"土 (thổ: đất) + 报 (báo: báo) → tin tức từ đất → báo. Mẹo: \"Tin từ đất là báo\"","ex":"予報","r":"yohō","em":"dự báo","x":""},{"t":"k","l":40,"k":"忘","h":"vong","m":"quên","n":"亡 (vong: mất) + 心 (tâm: tim) → tim mất → quên. Mẹo: \"Tim mất là quên\"","ex":"忘年会","r":"bōnenkai","em":"tiệc cuối năm (quên năm cũ)","x":""},{"t":"k","l":40,"k":"新","h":"tân","m":"mới","n":"親 (thân: thân) + 斤 (cân: rìu) → rìu chặt cây mới → mới. Mẹo: \"Rìu chặt cây mới\"","ex":"新年会","r":"shinnenkai","em":"tiệc đầu năm","x":""},{"t":"k","l":40,"k":"年","h":"niên","m":"năm","n":"Hình người gánh lúa → mùa màng, năm. Mẹo: \"Người gánh lúa là năm\"","ex":"新年会","r":"shinnenkai","em":"tiệc đầu năm","x":""},{"t":"k","l":40,"k":"二","h":"nhị","m":"hai, thứ hai","n":"Hai nét ngang → số 2. Mẹo: \"Hai nét là nhị\"","ex":"二次会","r":"nijikai","em":"tiệc lần 2 (nhị thứ hội)","x":""},{"t":"k","l":40,"k":"次","h":"thứ","m":"thứ tự, lần tiếp theo","n":"冫 (băng: nước đá) + 欠 (khiếm: thiếu) → thiếu nước đá → thứ hai. Mẹo: \"Thiếu nước đá là thứ\"","ex":"二次会","r":"nijikai","em":"tiệc lần 2","x":""},{"t":"k","l":40,"k":"表","h":"biểu","m":"bề mặt, biểu hiện","n":"毛 (mao: lông) + 衣 (y: áo) → lông áo ở mặt ngoài. Mẹo: \"Lông ngoài áo là bề mặt\"","ex":"表","r":"omote","em":"mặt trước, bề ngoài","x":""},{"t":"k","l":40,"k":"裏","h":"lý","m":"mặt sau, bên trong","n":"衣 (y: áo) + 里 (lý: dặm) → áo có lớp lót bên trong. Mẹo: \"Áo bên trong là lý\"","ex":"裏","r":"ura","em":"mặt sau, bên trong","x":""},{"t":"k","l":40,"k":"傷","h":"thương","m":"vết thương","n":"亻 (nhân: người) + 昜 (dương: mặt trời) → người phơi nắng bị thương. Mẹo: \"Người nắng bị thương\"","ex":"傷","r":"kizu","em":"vết thương","x":""},{"t":"k","l":40,"k":"寄","h":"ký","m":"gửi, dựa vào","n":"宀 (miên: nhà) + 奇 (kỳ: lạ) → gửi đồ lạ vào nhà → gửi, dựa. Mẹo: \"Gửi đồ lạ vào nhà\"","ex":"年寄り","r":"toshiyori","em":"người già (tuổi gửi)","x":""},{"t":"k","l":40,"k":"長","h":"trường","m":"dài, trưởng thành","n":"Hình tóc dài → dài, lâu. Mẹo: \"Tóc dài là trường\"","ex":"長さ","r":"nagasa","em":"chiều dài","x":""},{"t":"k","l":40,"k":"重","h":"trọng","m":"nặng, quan trọng","n":"Hình người gánh nặng → nặng. Mẹo: \"Người gánh nặng là trọng\"","ex":"重さ","r":"omosa","em":"trọng lượng","x":""},{"t":"k","l":40,"k":"高","h":"cao","m":"cao","n":"Hình cái đài cao → cao. Mẹo: \"Cái đài cao là cao\"","ex":"高さ","r":"takasa","em":"chiều cao","x":""},{"t":"k","l":40,"k":"便","h":"tiện","m":"tiện lợi, thư tín","n":"亻 (nhân: người) + 更 (canh: thay đổi) → người thay đổi để tiện lợi. Mẹo: \"Người thay đổi cho tiện\"","ex":"～便","r":"～bin","em":"chuyến bay, thư tín","x":""},{"t":"k","l":40,"k":"個","h":"cá","m":"cái, vật","n":"亻 (nhân: người) + 固 (cố: vững chắc) → người đứng vững một cái. Mẹo: \"Người vững là cái\"","ex":"～個","r":"～ko","em":"đếm đồ vật nhỏ","x":""},{"t":"k","l":40,"k":"本","h":"bổn","m":"cuốn, quyển, gốc","n":"Cây có gốc → gốc, quyển sách. Mẹo: \"Cây gốc là bổn\"","ex":"～本","r":"～hon / pon / bon","em":"đếm vật dài, cuốn","x":""},{"t":"k","l":40,"k":"杯","h":"bôi","m":"ly, cốc","n":"木 (mộc: gỗ) + 不 (bất: không) → đồ đựng bằng gỗ → cốc. Mẹo: \"Gỗ không là cốc\"","ex":"～杯","r":"～hai / pai / bai","em":"đếm ly, cốc","x":""},{"t":"k","l":40,"k":"以","h":"dĩ","m":"từ, để","n":"亻 (nhân: người) + 乁 (dĩ: đi) → người từ đó đi → từ, để. Mẹo: \"Người đi là dĩ\"","ex":"以上","r":"ijō","em":"trở lên","x":""},{"t":"k","l":40,"k":"上","h":"thượng","m":"trên","n":"Nét trên chỉ vị trí bên trên. Mẹo: \"Vạch trên là thượng\"","ex":"以上","r":"ijō","em":"trở lên","x":""},{"t":"k","l":40,"k":"下","h":"hạ","m":"dưới","n":"Nét dưới chỉ vị trí bên dưới. Mẹo: \"Vạch dưới là hạ\"","ex":"以下","r":"ika","em":"trở xuống","x":""},{"t":"k","l":41,"k":"上","h":"thượng","m":"lên, nâng lên","n":"Nét ngang phía trên chỉ vị trí bên trên → phía trên, lên. Mẹo: \"Vạch trên là thượng\"","ex":"上げます","r":"agemasu","em":"nâng lên, tăng lên","x":""},{"t":"k","l":41,"k":"下","h":"hạ","m":"xuống, hạ xuống","n":"Nét ngang phía dưới chỉ vị trí bên dưới → phía dưới, xuống. Mẹo: \"Vạch dưới là hạ\"","ex":"下げます","r":"sagemasu","em":"hạ xuống, giảm xuống","x":""},{"t":"k","l":41,"k":"親","h":"thân","m":"cha mẹ, thân thiết","n":"立 (lập: đứng) + 木 (mộc: cây) + 見 (kiến: thấy) → đứng dưới cây thấy người thân → thân thiết. Mẹo: \"Đứng cây thấy thân\"","ex":"親切にします","r":"shinsetsu ni shimasu","em":"tử tế, thân thiết","x":""},{"t":"k","l":41,"k":"切","h":"thiết","m":"cắt, thiết tha","n":"七 (thất: bảy) + 刀 (đao: dao) → dao cắt thành bảy. Mẹo: \"Dao cắt bảy là thiết\"","ex":"親切にします","r":"shinsetsu ni shimasu","em":"tử tế, ân cần","x":""},{"t":"k","l":41,"k":"珍","h":"trân","m":"quý hiếm, lạ","n":"王 (vương: ngọc) + 㐱 (trân: hiếm) → ngọc quý hiếm → trân bảo, lạ. Mẹo: \"Ngọc hiếm là trân\"","ex":"珍しい","r":"mezurashii","em":"hiếm, lạ, quý","x":""},{"t":"k","l":41,"k":"祝","h":"chúc","m":"chúc mừng, chúc phúc","n":"礻 (thị: thần) + 兄 (huynh: anh) → thần thánh chúc cho anh → chúc mừng. Mẹo: \"Thần chúc anh là chúc\"","ex":"お祝い","r":"oiwai","em":"lễ chúc mừng","x":""},{"t":"k","l":41,"k":"玉","h":"ngọc","m":"ngọc, báu vật","n":"Hình viên ngọc có dấu chấm (vết khuyết) → ngọc. Mẹo: \"Viên ngọc là ngọc\"","ex":"お年玉","r":"otoshidama","em":"tiền mừng tuổi (ngọc đầu năm)","x":""},{"t":"k","l":41,"k":"舞","h":"vũ","m":"múa, nhảy múa","n":"無 (vô: không) + 舛 (suyễn: đối xứng) → người nhảy múa đối xứng. Mẹo: \"Múa không đối xứng là vũ\"","ex":"お見舞い","r":"omimai","em":"đi thăm hỏi (kiến vũ)","x":""},{"t":"k","l":41,"k":"興","h":"hưng","m":"hứng thú, vui thú","n":"臼 (cữu: cối) + 同 (đồng: cùng) + 八 (bát: tám) → hứng thú cùng nhau. Mẹo: \"Cùng hứng là hưng\"","ex":"興味","r":"kyōmi","em":"sự thú vị, hứng thú","x":""},{"t":"k","l":41,"k":"味","h":"vị","m":"mùi vị, ý vị","n":"口 (khẩu: miệng) + 未 (vị: chưa) → miệng chưa nếm nên tò mò → vị. Mẹo: \"Miệng nếm là vị\"","ex":"興味","r":"kyōmi","em":"sự thú vị","x":""},{"t":"k","l":41,"k":"情","h":"tình","m":"tình cảm, tình trạng","n":"忄 (tâm: tim) + 青 (thanh: xanh) → tâm xanh tình cảm. Mẹo: \"Tâm xanh là tình\"","ex":"情報","r":"jōhō","em":"thông tin (tình báo)","x":""},{"t":"k","l":41,"k":"報","h":"báo","m":"báo tin, thông báo","n":"土 (thổ: đất) + 报 (báo: báo) → tin tức từ đất → báo. Mẹo: \"Tin từ đất là báo\"","ex":"情報","r":"jōhō","em":"thông tin","x":""},{"t":"k","l":41,"k":"文","h":"văn","m":"chữ viết, văn học","n":"Hình người có hình xăm (văn thân) → chữ viết. Mẹo: \"Hình xăm là văn\"","ex":"文法","r":"bumpō","em":"văn phạm, ngữ pháp","x":""},{"t":"k","l":41,"k":"法","h":"pháp","m":"pháp luật, quy tắc","n":"氵 (thủy: nước) + 去 (khứ: đi) → nước chảy theo quy tắc → pháp. Mẹo: \"Nước chảy theo luật là pháp\"","ex":"文法","r":"bumpō","em":"văn phạm","x":""},{"t":"k","l":41,"k":"音","h":"âm","m":"âm thanh","n":"立 (lập: đứng) + 日 (nhật: mặt trời) → tiếng nói dưới mặt trời. Mẹo: \"Tiếng dưới trời là âm\"","ex":"発音","r":"hatsuon","em":"phát âm","x":""},{"t":"k","l":41,"k":"猿","h":"viên","m":"con khỉ","n":"犭 (quyến: thú) + 袁 (viên: mũi dài) → con thú mũi dài → khỉ. Mẹo: \"Thú mũi dài là khỉ\"","ex":"猿","r":"saru","em":"con khỉ","x":""},{"t":"k","l":41,"k":"絵","h":"hội","m":"tranh vẽ, bức vẽ","n":"糸 (mịch: tơ) + 会 (hội: họp) → tơ họp thành tranh. Mẹo: \"Tơ họp thành tranh\"","ex":"絵はがき","r":"ehagaki","em":"bưu thiếp tranh (hội bưu)","x":""},{"t":"k","l":41,"k":"葉","h":"diệp","m":"lá (cây)","n":"艸 (thảo: cỏ) + 世 (thế: thế giới) + 木 (mộc: cây) → thế giới cỏ cây đều có lá. Mẹo: \"Cỏ cây thế giới có lá\"","ex":"絵はがき","r":"ehagaki","em":"bưu thiếp (diệp có nhầm, thực tế はがき viết là 葉書 - lá thư)","x":""},{"t":"k","l":41,"k":"書","h":"thư","m":"sách, viết","n":"聿 (duật: bút) + 日 (nhật: mặt trời) → viết dưới mặt trời → sách vở. Mẹo: \"Bút viết là thư\"","ex":"絵はがき","r":"ehagaki","em":"bưu thiếp (thực tế: 葉書 có nghĩa là bưu thiếp)","x":""},{"t":"k","l":41,"k":"靴","h":"ngoa","m":"giày","n":"革 (cách: da) + 化 (hóa: biến hóa) → da biến hóa thành giày. Mẹo: \"Da hóa giày là ngoa\"","ex":"靴下","r":"kutsushita","em":"tất, vớ (giày dưới)","x":""},{"t":"k","l":41,"k":"下","h":"hạ","m":"dưới","n":"Phía dưới → dưới. Mẹo: \"Vạch dưới là hạ\"","ex":"靴下","r":"kutsushita","em":"tất, vớ","x":""},{"t":"k","l":41,"k":"手","h":"thủ","m":"tay","n":"Hình bàn tay với năm ngón → tay. Mẹo: \"Bàn tay là thủ\"","ex":"手袋","r":"tebukuro","em":"găng tay (tay túi)","x":""},{"t":"k","l":41,"k":"袋","h":"đại","m":"túi, bao","n":"衣 (y: áo) + 代 (đại: thay) → áo thay đổi thành túi. Mẹo: \"Áo thay thành túi là đại\"","ex":"手袋","r":"tebukuro","em":"găng tay","x":""},{"t":"k","l":41,"k":"幼","h":"ấu","m":"trẻ nhỏ, ấu thơ","n":"幺 (yêu: nhỏ) + 力 (lực: sức) → sức nhỏ như trẻ con. Mẹo: \"Sức nhỏ là ấu\"","ex":"幼稚園","r":"yōchien","em":"trường mẫu giáo","x":""},{"t":"k","l":41,"k":"稚","h":"trĩ","m":"trẻ thơ, non dại","n":"禾 (hòa: lúa) + 隹 (chuy: chim) → chim non ăn lúa → trẻ con. Mẹo: \"Chim non ăn lúa là trĩ\"","ex":"幼稚園","r":"yōchien","em":"trường mẫu giáo","x":""},{"t":"k","l":41,"k":"園","h":"viên","m":"vườn, khu vườn","n":"囗 (vi: bao vây) + 袁 (viên: mũi dài) → bao vây khu vườn. Mẹo: \"Bao vây vườn là viên\"","ex":"幼稚園","r":"yōchien","em":"trường mẫu giáo","x":""},{"t":"k","l":41,"k":"暖","h":"noãn","m":"ấm áp","n":"日 (nhật: mặt trời) + 爰 (viên: từ từ) → mặt trời từ từ làm ấm. Mẹo: \"Mặt trời từ từ ấm là noãn\"","ex":"暖房","r":"danbō","em":"máy sưởi (ấm phòng)","x":""},{"t":"k","l":41,"k":"房","h":"phòng","m":"căn phòng","n":"戸 (hộ: cửa) + 方 (phương: vuông) → căn phòng vuông có cửa. Mẹo: \"Cửa vuông là phòng\"","ex":"暖房","r":"danbō","em":"sưởi ấm","x":""},{"t":"k","l":41,"k":"冷","h":"lãnh","m":"lạnh","n":"冫 (băng: nước đá) + 令 (lệnh: ra lệnh) → băng ra lệnh lạnh. Mẹo: \"Băng ra lệnh là lạnh\"","ex":"冷房","r":"reibō","em":"máy lạnh (lạnh phòng)","x":""},{"t":"k","l":41,"k":"温","h":"ôn","m":"ấm áp","n":"氵 (thủy: nước) + 昷 (ôn: ấm) → nước ấm. Mẹo: \"Nước ấm là ôn\"","ex":"温度","r":"ondo","em":"nhiệt độ (ấm độ)","x":""},{"t":"k","l":41,"k":"度","h":"độ","m":"độ, mức độ","n":"广 (nghiễm: mái nhà) + 廿 (niệm: hai mươi) + 又 (hựu: lại) → thước đo mức độ. Mẹo: \"Thước đo là độ\"","ex":"温度","r":"ondo","em":"nhiệt độ","x":""},{"t":"k","l":41,"k":"祖","h":"tổ","m":"tổ tiên, ông bà","n":"礻 (thị: thần) + 且 (thả: mà) → thần tổ tiên. Mẹo: \"Thần tổ là tổ\"","ex":"祖父","r":"sofu","em":"ông nội (tổ phụ)","x":""},{"t":"k","l":41,"k":"父","h":"phụ","m":"cha, bố","n":"Tay cầm cây gậy → người cha. Mẹo: \"Cây gậy là cha\"","ex":"祖父","r":"sofu","em":"ông nội","x":""},{"t":"k","l":41,"k":"母","h":"mẫu","m":"mẹ","n":"Hai bầu vú → người mẹ. Mẹo: \"Vú là mẹ\"","ex":"祖母","r":"sobo","em":"bà nội (tổ mẫu)","x":""},{"t":"k","l":41,"k":"孫","h":"tôn","m":"cháu (con của con)","n":"子 (tử: con) + 系 (hệ: dòng dõi) → cháu nối dõi. Mẹo: \"Con nối dõi là cháu\"","ex":"孫","r":"mago","em":"đứa cháu","x":""},{"t":"k","l":41,"k":"管","h":"quản","m":"ống, quản lý","n":"竹 (trúc: tre) + 官 (quan: quan) → tre làm ống để quản lý. Mẹo: \"Tre quan quản lý\"","ex":"管理人","r":"kanrinin","em":"người quản lý","x":""},{"t":"k","l":41,"k":"理","h":"lý","m":"lý lẽ, quản lý","n":"王 (vương: ngọc) + 里 (lý: dặm) → ngọc ở dặm lý → lý lẽ, quản lý. Mẹo: \"Ngọc dặm là lý\"","ex":"管理人","r":"kanrinin","em":"người quản lý","x":""},{"t":"k","l":41,"k":"人","h":"nhân","m":"người","n":"Hình người đang đứng → người. Mẹo: \"Người đứng là nhân\"","ex":"管理人","r":"kanrinin","em":"người quản lý","x":""},{"t":"k","l":41,"k":"間","h":"gian","m":"giữa, khoảng","n":"門 (môn: cửa) + 日 (nhật: mặt trời) → cửa sổ có ánh trời lọt vào. Mẹo: \"Cửa có trời là gian\"","ex":"この間","r":"kono aida","em":"khoảng thời gian này","x":""},{"t":"k","l":42,"k":"包","h":"bao","m":"gói, bọc","n":"勹 (bao: bao bọc) + 巳 (tỵ: con rắn) → bao bọc con rắn lại → gói. Mẹo: \"Bao con rắn là gói\"","ex":"包みます","r":"tsutsumimasu","em":"gói, bọc","x":""},{"t":"k","l":42,"k":"沸","h":"phất/phi","m":"sôi, sục sôi","n":"氵 (thủy: nước) + 弗 (phất: chẳng) → nước chẳng còn im lặng → sôi. Mẹo: \"Nước chẳng im là sôi\"","ex":"沸かします","r":"wakashimasu","em":"đun sôi","x":""},{"t":"k","l":42,"k":"混","h":"hỗn","m":"trộn lẫn, hỗn hợp","n":"氵 (thủy: nước) + 昆 (côn: côn trùng) → nước có côn trùng trộn lẫn → hỗn tạp. Mẹo: \"Nước côn trùng trộn là hỗn\"","ex":"混ぜます","r":"mazemasu","em":"trộn lẫn","x":""},{"t":"k","l":42,"k":"計","h":"kế","m":"tính toán, kế hoạch","n":"言 (ngôn: lời) + 十 (thập: mười) → nói mười lần để tính toán → kế. Mẹo: \"Nói mười là tính\"","ex":"計算します","r":"keisan shimasu","em":"tính toán","x":""},{"t":"k","l":42,"k":"算","h":"toán","m":"tính toán, bàn tính","n":"竹 (trúc: tre) + 目 (mục: mắt) + 廾 (củng: hai tay) → dùng tre, mắt, tay để tính. Mẹo: \"Tre mắt tay là tính\"","ex":"計算します","r":"keisan shimasu","em":"tính toán","x":""},{"t":"k","l":42,"k":"並","h":"tịnh","m":"xếp hàng, sánh vai","n":"丷 (bát: hai) + 立 (lập: đứng) → hai người đứng cạnh nhau → xếp hàng. Mẹo: \"Hai đứng cạnh là tịnh\"","ex":"並びます","r":"narabimasu","em":"xếp hàng, đứng cạnh","x":""},{"t":"k","l":42,"k":"丈","h":"trượng","m":"trượng (đơn vị, chồng)","n":"大 (đại: lớn) + 丶 (chấm: chỉ) → người lớn cao một trượng. Mẹo: \"Người lớn cao là trượng\"","ex":"丈夫[な]","r":"jōbu [na]","em":"chắc chắn, khỏe mạnh","x":""},{"t":"k","l":42,"k":"夫","h":"phu","m":"chồng, người đàn ông","n":"大 (đại: lớn) + 一 (nhất: một) → người đàn ông có trách nhiệm. Mẹo: \"Người đàn ông là phu\"","ex":"丈夫[な]","r":"jōbu [na]","em":"chắc chắn, khỏe mạnh","x":""},{"t":"k","l":42,"k":"弁","h":"biện","m":"biện luận, nói","n":"厶 (khư: riêng) + 廾 (củng: hai tay) → hai tay riêng để biện luận. Mẹo: \"Tay riêng biện luận\"","ex":"弁護士","r":"bengoshi","em":"luật sư","x":""},{"t":"k","l":42,"k":"護","h":"hộ","m":"bảo vệ, che chở","n":"言 (ngôn: lời) + 蒦 (hộ: giữ) → lời giữ gìn bảo vệ. Mẹo: \"Lời giữ gìn là hộ\"","ex":"弁護士","r":"bengoshi","em":"luật sư","x":""},{"t":"k","l":42,"k":"士","h":"sĩ","m":"học giả, người trí thức","n":"Hình người đàn ông đứng thẳng → người tri thức. Mẹo: \"Người đứng thẳng là sĩ\"","ex":"弁護士","r":"bengoshi","em":"luật sư","x":""},{"t":"k","l":42,"k":"音","h":"âm","m":"âm thanh, nhạc","n":"立 (lập: đứng) + 日 (nhật: mặt trời) → âm thanh phát ra dưới mặt trời. Mẹo: \"Dưới trời có âm\"","ex":"音楽家","r":"ongakuka","em":"nhạc sĩ","x":""},{"t":"k","l":42,"k":"楽","h":"nhạc","m":"âm nhạc, vui vẻ","n":"木 (mộc: cây) + 白 (bạch: trắng) + 糸 (mịch: tơ) → gảy đàn bằng tơ → âm nhạc. Mẹo: \"Cây trắng tơ là nhạc\"","ex":"音楽家","r":"ongakuka","em":"nhạc sĩ","x":""},{"t":"k","l":42,"k":"家","h":"gia","m":"nhà, gia đình, người chuyên","n":"宀 (miên: nhà) + 豕 (thỉ: heo) → trong nhà có heo → gia đình. Mẹo: \"Nhà có heo là gia\"","ex":"音楽家","r":"ongakuka","em":"nhạc sĩ","x":""},{"t":"k","l":42,"k":"子","h":"tử","m":"con, trẻ em","n":"Hình đứa trẻ quấn tã → con cái. Mẹo: \"Đứa trẻ là tử\"","ex":"子どもたち","r":"kodomo-tachi","em":"những đứa trẻ","x":""},{"t":"k","l":42,"k":"自","h":"tự","m":"tự mình, từ","n":"Hình cái mũi → tự mình (chỉ bản thân). Mẹo: \"Cái mũi là tự\"","ex":"自然","r":"shizen","em":"tự nhiên","x":""},{"t":"k","l":42,"k":"然","h":"nhiên","m":"vậy, như thế","n":"犬 (khuyển: chó) + 肉 (nhục: thịt) + 火 (hỏa: lửa) → thịt chó nướng chín → tự nhiên. Mẹo: \"Chó nướng tự nhiên\"","ex":"自然","r":"shizen","em":"tự nhiên","x":""},{"t":"k","l":42,"k":"教","h":"giáo","m":"dạy bảo, giáo dục","n":"攵 (phộc: đánh) + 孝 (hiếu: hiếu thảo) → dạy đạo hiếu bằng đánh → giáo dục. Mẹo: \"Đánh hiếu là giáo\"","ex":"教育","r":"kyōiku","em":"giáo dục","x":""},{"t":"k","l":42,"k":"育","h":"dục","m":"nuôi dưỡng, giáo dục","n":"亠 (đầu) + 云 (vân: nói) + 月 (nguyệt: thịt) → dạy nuôi thịt → giáo dục. Mẹo: \"Nuôi thịt là dục\"","ex":"教育","r":"kyōiku","em":"giáo dục","x":""},{"t":"k","l":42,"k":"文","h":"văn","m":"chữ viết, văn hóa","n":"Hình xăm trên người → chữ viết. Mẹo: \"Xăm là văn\"","ex":"文化","r":"bunka","em":"văn hóa","x":""},{"t":"k","l":42,"k":"化","h":"hóa","m":"biến hóa, thay đổi","n":"亻 (nhân: người) + 匕 (chủy: thìa) → người cầm thìa biến hóa. Mẹo: \"Người cầm thìa hóa\"","ex":"文化","r":"bunka","em":"văn hóa","x":""},{"t":"k","l":42,"k":"社","h":"xã","m":"xã hội, công ty","n":"礻 (thị: thần) + 土 (thổ: đất) → đất thần xã hội. Mẹo: \"Đất thần là xã\"","ex":"社会","r":"shakai","em":"xã hội","x":""},{"t":"k","l":42,"k":"会","h":"hội","m":"hội họp, đoàn thể","n":"亼 (tập: họp) + 云 (vân: nói) → họp nói chuyện → hội. Mẹo: \"Họp nói là hội\"","ex":"社会","r":"shakai","em":"xã hội","x":""},{"t":"k","l":42,"k":"政","h":"chính","m":"chính trị, chính quyền","n":"正 (chính: đúng) + 攵 (phộc: đánh) → đánh để giữ chính. Mẹo: \"Đánh chính là trị\"","ex":"政治","r":"seiji","em":"chính trị","x":""},{"t":"k","l":42,"k":"治","h":"trị","m":"trị vì, chữa bệnh","n":"氵 (thủy: nước) + 台 (đài: đài) → nước đài trị bệnh. Mẹo: \"Nước đài là trị\"","ex":"政治","r":"seiji","em":"chính trị","x":""},{"t":"k","l":42,"k":"法","h":"pháp","m":"pháp luật, phương pháp","n":"氵 (thủy: nước) + 去 (khứ: đi) → nước chảy theo luật → pháp. Mẹo: \"Nước chảy theo luật là pháp\"","ex":"法律","r":"hōritsu","em":"pháp luật","x":""},{"t":"k","l":42,"k":"律","h":"luật","m":"luật lệ, điều luật","n":"彳 (sách: bước) + 聿 (duật: bút) → bước theo bút vạch luật. Mẹo: \"Bước theo bút là luật\"","ex":"法律","r":"hōritsu","em":"pháp luật","x":""},{"t":"k","l":42,"k":"戦","h":"chiến","m":"chiến tranh, đánh nhau","n":"単 (đơn: đơn) + 戈 (qua: giáo) → đơn độc cầm giáo đánh. Mẹo: \"Đơn cầm giáo là chiến\"","ex":"戦争","r":"sensō","em":"chiến tranh","x":""},{"t":"k","l":42,"k":"争","h":"tranh","m":"tranh giành, cãi nhau","n":"爪 (trảo: tay) + 手 (thủ: tay) + 亅 (quyết: móc) → hai tay tranh nhau. Mẹo: \"Tay tranh tay là tranh\"","ex":"戦争","r":"sensō","em":"chiến tranh","x":""},{"t":"k","l":42,"k":"平","h":"bình","m":"bình yên, bằng phẳng","n":"干 (can: khô) + 丶 (chấm: điểm) → mặt bằng phẳng. Mẹo: \"Mặt bằng là bình\"","ex":"平和","r":"heiwa","em":"hòa bình","x":""},{"t":"k","l":42,"k":"和","h":"hòa","m":"hòa bình, hòa hợp","n":"禾 (hòa: lúa) + 口 (khẩu: miệng) → miệng ăn lúa hòa hợp. Mẹo: \"Lúa miệng là hòa\"","ex":"平和","r":"heiwa","em":"hòa bình","x":""},{"t":"k","l":42,"k":"目","h":"mục","m":"mắt, mục tiêu","n":"Hình con mắt → mắt, mục đích. Mẹo: \"Con mắt là mục\"","ex":"目的","r":"mokuteki","em":"mục đích","x":""},{"t":"k","l":42,"k":"的","h":"đích","m":"đích, mục tiêu","n":"白 (bạch: trắng) + 勺 (chước: muỗng) → mục tiêu như muỗng trắng. Mẹo: \"Muỗng trắng là đích\"","ex":"目的","r":"mokuteki","em":"mục đích","x":""},{"t":"k","l":42,"k":"論","h":"luận","m":"bàn luận, luận văn","n":"言 (ngôn: lời) + 侖 (luân: bánh xe) → lời xoay vần bàn luận. Mẹo: \"Lời xoay là luận\"","ex":"論文","r":"ronbun","em":"luận văn","x":""},{"t":"k","l":42,"k":"文","h":"văn","m":"văn bản, chữ viết","n":"Hình xăm → chữ viết. Mẹo: \"Xăm là văn\"","ex":"論文","r":"ronbun","em":"luận văn","x":""},{"t":"k","l":42,"k":"楽","h":"lạc","m":"vui vẻ, thú vị","n":"木 (mộc: cây) + 白 (bạch: trắng) + 糸 (mịch: tơ) → gảy tơ trên cây trắng → vui. Mẹo: \"Tơ cây trắng vui\"","ex":"楽しみ","r":"tanoshimi","em":"niềm vui, sự thú vị","x":""},{"t":"k","l":42,"k":"栓","h":"xuyên","m":"nút, chốt","n":"木 (mộc: gỗ) + 全 (toàn: trọn) → gỗ trọn làm nút. Mẹo: \"Gỗ trọn là nút\"","ex":"栓抜き","r":"sen'nuki","em":"cái mở nút chai","x":""},{"t":"k","l":42,"k":"抜","h":"bạt","m":"nhổ ra, rút ra","n":"扌 (thủ: tay) + 友 (hữu: bạn) → tay bạn nhổ ra. Mẹo: \"Tay bạn nhổ là bạt\"","ex":"栓抜き","r":"sen'nuki","em":"cái mở nút (xuyên bạt)","x":""},{"t":"k","l":42,"k":"缶","h":"phẫu","m":"lon, hộp","n":"午 (ngọ: trưa) + 山 (sơn: núi) → hộp đựng như núi → lon. Mẹo: \"Núi trưa là lon\"","ex":"缶切り","r":"kankiri","em":"đồ khui đồ hộp","x":""},{"t":"k","l":42,"k":"切","h":"thiết","m":"cắt","n":"七 (thất: bảy) + 刀 (đao: dao) → dao cắt bảy. Mẹo: \"Dao cắt bảy là thiết\"","ex":"缶切り","r":"kankiri","em":"đồ khui đồ hộp (phẫu thiết)","x":""},{"t":"k","l":42,"k":"詰","h":"cật","m":"nhét, đóng hộp","n":"言 (ngôn: lời) + 吉 (cát: tốt) → nói tốt đóng hộp. Mẹo: \"Nói tốt đóng hộp\"","ex":"缶詰","r":"kanzume","em":"đồ hộp","x":""},{"t":"k","l":42,"k":"袋","h":"đại","m":"túi, bao","n":"衣 (y: áo) + 代 (đại: thay) → áo thay đổi thành túi. Mẹo: \"Áo thay thành túi\"","ex":"のし袋","r":"noshibukuro","em":"phong bì (túi)","x":""},{"t":"k","l":42,"k":"体","h":"thể","m":"thân thể, cơ thể","n":"亻 (nhân: người) + 本 (bổn: gốc) → gốc người là thân thể. Mẹo: \"Gốc người là thể\"","ex":"体温計","r":"taionkei","em":"nhiệt kế (thể ôn kế)","x":""},{"t":"k","l":42,"k":"温","h":"ôn","m":"ấm","n":"氵 (thủy: nước) + 昷 (ôn: ấm) → nước ấm. Mẹo: \"Nước ấm là ôn\"","ex":"体温計","r":"taionkei","em":"nhiệt kế","x":""},{"t":"k","l":42,"k":"計","h":"kế","m":"đo, tính","n":"言 (ngôn: lời) + 十 (thập: mười) → tính bằng lời. Mẹo: \"Lời mười là tính\"","ex":"体温計","r":"taionkei","em":"nhiệt kế","x":""},{"t":"k","l":42,"k":"材","h":"tài","m":"vật liệu, nguyên liệu","n":"木 (mộc: gỗ) + 才 (tài: tài năng) → gỗ có tài làm vật liệu. Mẹo: \"Gỗ tài là vật liệu\"","ex":"材料","r":"zairyō","em":"vật liệu","x":""},{"t":"k","l":42,"k":"料","h":"liệu","m":"vật liệu, nguyên liệu","n":"米 (mễ: gạo) + 斗 (đẩu: đ
